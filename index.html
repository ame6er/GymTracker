<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LiftLog</title>
<meta name="description" content="A free, simple gym workout tracker.">
<meta name="theme-color" content="#f6f7fb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LiftLog">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{--bg:#f6f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e8eaf1;--input:#f2f4f8;--accent:#4f46e5;--accent2:#9333ea;--accent-soft:#eef0ff;--good:#16a34a;--good-soft:#dcfce7;--bad:#dc2626;--warn-soft:#fff6db;--cardline:transparent;--shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.05);color-scheme:light}
:root[data-theme=dark]{--bg:#0b0d12;--card:#151821;--text:#f1f5f9;--muted:#94a3b8;--line:#262a36;--input:#0f1219;--accent:#6366f1;--accent2:#a855f7;--accent-soft:#1f2245;--good:#22c55e;--good-soft:#11301e;--bad:#f87171;--warn-soft:#332a10;--cardline:#1f2330;--shadow:none;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.resting{padding-bottom:calc(174px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:calc(12px + env(safe-area-inset-top)) 16px 8px}
.top h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0 auto;max-width:608px}
main{max-width:640px;margin:0 auto;padding:6px 16px 24px}
h2{font-size:15px;font-weight:700;margin:22px 0 10px;color:var(--muted)}
h3{font-size:20px;margin:0 0 8px;letter-spacing:-.01em}
p{margin:6px 0}
.card{background:var(--card);border:1px solid var(--cardline);border-radius:20px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.banner{background:var(--warn-soft);box-shadow:none}
.muted{color:var(--muted)}
.small{font-size:14px}
.center{text-align:center}
.mt{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:8px}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.3;cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:14px;background:var(--input);font-weight:650;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.danger{color:var(--bad)}
.btn.dangerfill{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.icon-btn{width:36px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--input);border:1px solid transparent;border-radius:12px;padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{min-height:80px;resize:vertical}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;vertical-align:middle;letter-spacing:.01em}
:root[data-theme=dark] .tag{color:#c7d2fe}

/* Home */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 30%,transparent)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{width:180px;height:180px;right:-50px;top:-70px}
.hero::after{width:110px;height:110px;right:40px;bottom:-60px;background:rgba(255,255,255,.08)}
.hero>*{position:relative;z-index:1}
.hero .hi{font-size:14px;opacity:.85}
.hero .big{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-top:2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:16px;text-align:center}
.week span{font-size:11px;opacity:.8;font-weight:600}
.wdot{width:32px;height:32px;margin:4px auto 0;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.wdot.on{background:#fff}
.wdot.today{outline:2px solid rgba(255,255,255,.9);outline-offset:2px}
.mini{display:flex;gap:8px;margin-top:16px}
.mini div{flex:1;background:rgba(255,255,255,.14);border-radius:14px;padding:8px 10px;font-size:12px}
.mini b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.day{display:flex;align-items:center;gap:12px}
.badge{width:46px;height:46px;border-radius:15px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.dayname{font-weight:750;font-size:17px;letter-spacing:-.01em}
.go{width:50px;height:50px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 6px 14px color-mix(in srgb,var(--c) 40%,transparent);transition:transform .15s}
.go:active{transform:scale(.9)}
.welcome{text-align:center;padding:24px 8px}
.logo{width:88px;height:88px;border-radius:28px;margin:10px auto 18px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 12px 30px color-mix(in srgb,var(--accent) 35%,transparent)}
.welcome h3{font-size:26px;font-weight:800}
.steps{text-align:left;margin:22px 0}
.steps div{display:flex;gap:12px;align-items:center;padding:10px 0}
.steps i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
:root[data-theme=dark] .steps i{color:#c7d2fe}

/* Workout */
.livecard{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));color:#fff;border:0}
.livecard .dayname{font-size:22px}
.elapsed{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.prog{height:8px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:14px}
.prog div{height:100%;background:#fff;border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.num{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;transition:background .3s}
.num.ok{background:var(--good);color:#fff}
.exname{font-weight:750;font-size:17px}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center}
.sets .hd{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.sets input{text-align:center;padding:11px 4px;font-variant-numeric:tabular-nums;font-weight:600;transition:background .3s}
.sets input.done{background:var(--good-soft)}
.setno{text-align:center;color:var(--muted);font-weight:700}
.check{width:48px;height:46px;border-radius:14px;background:var(--input);display:flex;align-items:center;justify-content:center;color:var(--muted);opacity:.8;transition:background .2s}
.check.on{background:var(--good);color:#fff;opacity:1}
.check.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

/* Plan editor */
.cdot{width:30px;height:30px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.dname{font-weight:750;font-size:18px;background:transparent;padding:8px 6px}
.pex{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.pex:first-of-type{margin-top:8px}
.pex input{background:transparent;padding:9px 6px;font-weight:600}
.pill{font-size:12px;font-weight:700;color:var(--muted);background:var(--input);border-radius:999px;padding:7px 11px;white-space:nowrap;flex:none}
.pill.on{background:var(--accent-soft);color:var(--accent)}
.opts{background:var(--input);border-radius:14px;padding:12px;margin:2px 0 10px}
.opts .btn{background:var(--card)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:38px;height:38px;border-radius:12px;background:var(--card);font-size:20px;font-weight:700}
.stepper b{min-width:24px;text-align:center;font-size:18px}
.tgl{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tgl.on{background:var(--good)}
.tgl.on::after{transform:translateX(20px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px dashed var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--muted);transition:transform .12s}
.chip:active{transform:scale(.95)}
.chip::before{content:"+ ";color:var(--accent)}

/* Shared bits */
.seg{display:flex;background:var(--input);border-radius:14px;padding:4px;gap:2px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-weight:650;color:var(--muted);font-size:14px;padding:0 4px;transition:background .2s,color .2s}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--cardline);box-shadow:var(--shadow);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.sheet .stat{background:var(--input);box-shadow:none}
.loghead{display:flex;width:100%;text-align:left;align-items:center;gap:12px}
.chev{color:var(--muted);transition:transform .2s;display:flex}
.chev.up{transform:rotate(180deg)}
.logex{padding:10px 0;border-top:1px solid var(--line)}
.logbody{margin-top:12px}
.note{white-space:pre-wrap;background:var(--input);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px}
.note1{margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-style:italic}
.empty{text-align:center;padding:48px 16px}
.empty .logo{width:72px;height:72px;border-radius:24px}
canvas#chart{display:block;width:100%;height:220px}
.list-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.list-row:first-child{border-top:0}
.plates{display:flex;align-items:center;gap:4px;height:100px;margin:8px 0}
.plates .barend{width:24px;height:12px;background:var(--muted);border-radius:3px}
.plate{width:28px;border-radius:6px;background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}

/* Nav, rest bar, modal, toast */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs>div{display:flex;max-width:640px;margin:0 auto}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.tabs .ic{display:flex;padding:4px 18px;border-radius:999px;transition:background .25s}
.tabs button.on{color:var(--accent)}
.tabs button.on .ic{background:var(--accent-soft)}
:root[data-theme=dark] .tabs button.on{color:#c7d2fe}
.tabs svg{width:22px;height:22px}
.live{position:absolute;top:6px;left:calc(50% + 14px);width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px var(--card);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.4}}
.rest{position:fixed;left:10px;right:10px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:9;background:#111827;color:#fff;border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:6px;max-width:620px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.3)}
:root[data-theme=dark] .rest{background:#252a38}
.rest.over{background:var(--good)}
.rest .time{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.rest .track{height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin-top:6px;overflow:hidden}
.rest .track div{height:100%;background:linear-gradient(90deg,#818cf8,#c084fc);width:0;transition:width .25s linear}
.rest button{background:rgba(255,255,255,.12);border-radius:12px;min-height:40px;padding:0 10px;font-size:14px;font-weight:650}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:22px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:slideUp .28s cubic-bezier(.2,.8,.2,1)}
.sheet ul{padding-left:20px;margin:6px 0}
.sheet li{margin:4px 0}
.toast{position:fixed;left:16px;right:16px;top:calc(64px + env(safe-area-inset-top));z-index:30;background:#111827;color:#fff;border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:608px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:drop .25s ease}
.toast button{color:#a5b4fc;font-weight:700;min-height:36px;padding:0 4px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
@keyframes fade{from{opacity:0}}
@keyframes slideUp{from{transform:translateY(40px);opacity:.5}}
@keyframes drop{from{transform:translateY(-10px);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
.enter>*{animation:fadeUp .4s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.04s}
.enter>*:nth-child(3){animation-delay:.08s}
.enter>*:nth-child(4){animation-delay:.12s}
.enter>*:nth-child(5){animation-delay:.16s}
.enter>*:nth-child(n+6){animation-delay:.2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><h1 id="title">LiftLog</h1></header>
<main id="view"></main>

<div id="restBar" class="rest hidden" role="timer" aria-live="polite">
  <div class="grow">
    <div id="restLabel" class="small">Rest</div>
    <div id="restTime" class="time">0:00</div>
    <div class="track"><div id="restFill"></div></div>
  </div>
  <button data-act="restAdj" data-v="-15">-15s</button>
  <button data-act="restAdj" data-v="15">+15s</button>
  <button data-act="restSkip">Skip</button>
</div>

<nav class="tabs"><div>
  <button data-act="tab" data-tab="workout"><span id="liveDot" class="live hidden"></span><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></span>Workout</button>
  <button data-act="tab" data-tab="history"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span>History</button>
  <button data-act="tab" data-tab="progress"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M5 15l4-5 4 3 6-7"/></svg></span>Progress</button>
  <button data-act="tab" data-tab="settings"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span>Settings</button>
</div></nav>

<div id="modal" class="modal hidden"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast hidden" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script>
'use strict';
const KEY = 'liftlog-v1';
const DAY = 864e5;
const COLORS = ['#6366f1', '#ef4444', '#10b981', '#f59e0b', '#ec4899', '#0ea5e9', '#8b5cf6', '#f97316'];
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : 0; };
const blank = v => v == null || String(v).trim() === '';
const keyOf = n => String(n).trim().toLowerCase();

const ICON = {
  check: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  checkSm: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  up: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  play: '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  plates: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="3.5" height="14" rx="1"/><rect x="9" y="7.5" width="3" height="9" rx="1"/><path d="M12 12h9"/></svg>',
  dumbbell: '<svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>'
};

/* ---------- Data ---------- */
function defaults() {
  return { v: 1, unit: 'kg', theme: 'auto', rest: 90, bar: 20, days: [], logs: [], active: null, alert: true, lastBackup: 0, backupSnooze: 0 };
}

// Cleans up saved data so old or partial data always works.
// If the data shape ever changes, add a migration here (if (s.v < 2) {...}) and bump v.
function normalize(raw) {
  const s = Object.assign(defaults(), raw && typeof raw === 'object' ? raw : {});
  s.v = 1;
  if (s.unit !== 'lb') s.unit = 'kg';
  if (!['auto', 'light', 'dark'].includes(s.theme)) s.theme = 'auto';
  s.rest = Math.max(0, Math.round(num(s.rest)));
  if (!(typeof s.bar === 'number' && s.bar >= 0)) s.bar = s.unit === 'lb' ? 45 : 20;
  s.alert = s.alert !== false;
  s.lastBackup = num(s.lastBackup);
  s.backupSnooze = num(s.backupSnooze);
  s.days = (Array.isArray(s.days) ? s.days : []).filter(d => d && typeof d === 'object').map(d => Object.assign({}, d, {
    id: d.id || uid(), name: String(d.name == null ? 'Day' : d.name), color: d.color || COLORS[0],
    exercises: (Array.isArray(d.exercises) ? d.exercises : []).filter(e => e && typeof e === 'object').map(e => {
      const x = Object.assign({}, e, { id: e.id || uid(), name: String(e.name == null ? '' : e.name) });
      if (x.sets != null) { const n = Math.round(num(x.sets)); if (n >= 1 && n <= 20) x.sets = n; else delete x.sets; }
      return x;
    })
  }));
  s.logs = (Array.isArray(s.logs) ? s.logs : []).filter(l => l && typeof l === 'object' && Array.isArray(l.entries)).map(l => Object.assign({}, l, {
    id: l.id || uid(), date: num(l.date) || num(l.started) || Date.now(), started: num(l.started) || num(l.date),
    entries: l.entries.filter(e => e && typeof e === 'object').map(e => Object.assign({}, e, {
      name: String(e.name == null ? '' : e.name),
      sets: (Array.isArray(e.sets) ? e.sets : []).filter(x => x && typeof x === 'object').map(x => ({ w: num(x.w), r: num(x.r) }))
    }))
  }));
  const a = s.active;
  if (a && typeof a === 'object' && Array.isArray(a.items)) {
    a.started = num(a.started) || Date.now();
    a.items = a.items.filter(it => it && typeof it === 'object').map(it => Object.assign({}, it, {
      id: it.id || uid(), name: String(it.name == null ? '' : it.name),
      sets: (Array.isArray(it.sets) ? it.sets : []).filter(x => x && typeof x === 'object')
    }));
  } else s.active = null;
  return s;
}

function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { }
  if (!raw) return defaults();
  try { return normalize(JSON.parse(raw)); }
  catch (e) {
    // Never throw away data we cannot read: keep a copy under another key.
    try { localStorage.setItem(KEY + '-unreadable-' + Date.now(), raw); } catch (_) { }
    return defaults();
  }
}

let saveTimer = 0;
function save() {
  clearTimeout(saveTimer); saveTimer = 0;
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Could not save. Your phone storage may be full.'); }
}
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); }
window.addEventListener('pagehide', () => { if (saveTimer) save(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) save(); });

let S = load();
let view = 'workout';
const openLogs = new Set();
const prog = { name: '', metric: '' };
let chartPts = [];
let openEx = null;   // exercise whose options are open in the split editor
let popKey = '';     // set button that just got ticked, for the little pop animation

/* ---------- Helpers ---------- */
const fmt = n => String(Math.round(num(n) * 100) / 100);
const fmtInt = n => Math.round(n).toLocaleString('en-US');
function fmtSet(s, bw) {
  const w = num(s.w), r = num(s.r);
  if (bw) return w > 0 ? `+${fmt(w)} × ${r}` : `${r} reps`;
  return `${fmt(w)} × ${r}`;
}
function dur(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`;
}
function clock(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  const p = v => String(v).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(x)}` : `${m}:${p(x)}`;
}
function dayStart(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
function weekStart() { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); }
function dateStr(t, opt) { return new Date(t).toLocaleDateString('en-GB', opt || { weekday: 'short', day: 'numeric', month: 'short' }); }
function ago(t) {
  const d = Math.round((dayStart(Date.now()) - dayStart(t)) / DAY);
  if (d <= 0) return 'today';
  if (d === 1) return 'yesterday';
  if (d < 7) return d + ' days ago';
  if (d < 14) return '1 week ago';
  if (d < 60) return Math.floor(d / 7) + ' weeks ago';
  return dateStr(t, { day: 'numeric', month: 'short', year: 'numeric' });
}
const e1rm = (w, r) => (w <= 0 || r <= 0) ? 0 : (r === 1 ? w : w * (1 + r / 30));
function stats(sets) {
  let heavy = 0, orm = 0, vol = 0, reps = 0, maxr = 0;
  for (const s of sets) {
    const w = num(s.w), r = num(s.r);
    if (r <= 0) continue;
    reps += r; maxr = Math.max(maxr, r); vol += w * r; heavy = Math.max(heavy, w); orm = Math.max(orm, e1rm(w, r));
  }
  return { heavy, orm: Math.round(orm * 10) / 10, vol, reps, maxr };
}
function entriesFor(name) {
  const k = keyOf(name), out = [];
  for (const l of S.logs) for (const e of l.entries)
    if (keyOf(e.name) === k && e.sets.length) out.push({ date: l.date, sets: e.sets, bw: !!e.bw });
  return out.sort((a, b) => a.date - b.date);
}
function lastFor(name) { const a = entriesFor(name); return a.length ? a[a.length - 1] : null; }
function knownNames() {
  const m = new Map();
  for (const d of S.days) for (const e of d.exercises) if (e.name.trim()) m.set(keyOf(e.name), e.name.trim());
  for (const l of S.logs) for (const e of l.entries) if (e.name.trim() && !m.has(keyOf(e.name))) m.set(keyOf(e.name), e.name.trim());
  for (const n of POPULAR_ALL) if (!m.has(keyOf(n))) m.set(keyOf(n), n);
  return [...m.values()].sort((a, b) => a.localeCompare(b));
}
const BW_NAMES = new Set(['pull-up', 'chin-up', 'dips', 'push-up', 'hanging leg raise', 'ab wheel']);
function isBW(name) {
  const k = keyOf(name);
  for (const d of S.days) for (const e of d.exercises) if (keyOf(e.name) === k) return !!e.bw;
  const l = lastFor(name);
  return l ? !!l.bw : BW_NAMES.has(k);
}
const dayById = id => S.days.find(d => d.id === id);
const logVolume = l => l.entries.reduce((v, e) => v + stats(e.sets).vol, 0);
const logSets = l => l.entries.reduce((n, e) => n + e.sets.length, 0);
const initial = n => (String(n).trim()[0] || '?').toUpperCase();

/* ---------- Ideas for building a split ---------- */
const DAY_IDEAS = ['Push', 'Pull', 'Legs', 'Upper', 'Lower', 'Full body', 'Chest', 'Back', 'Shoulders', 'Arms'];
const EX_IDEAS = [
  [/push/, ['Bench press', 'Overhead press', 'Incline dumbbell press', 'Lateral raise', 'Triceps pushdown', 'Dips']],
  [/pull/, ['Deadlift', 'Pull-up', 'Barbell row', 'Lat pulldown', 'Seated cable row', 'Face pull', 'Biceps curl']],
  [/leg|lower/, ['Squat', 'Romanian deadlift', 'Leg press', 'Leg curl', 'Leg extension', 'Calf raise', 'Lunge']],
  [/upper/, ['Bench press', 'Barbell row', 'Overhead press', 'Pull-up', 'Biceps curl', 'Triceps pushdown']],
  [/chest/, ['Bench press', 'Incline dumbbell press', 'Chest fly', 'Dips', 'Push-up']],
  [/back/, ['Deadlift', 'Pull-up', 'Barbell row', 'Lat pulldown', 'Seated cable row']],
  [/shoulder/, ['Overhead press', 'Lateral raise', 'Rear delt fly', 'Face pull', 'Shrug']],
  [/arm|bicep|tricep/, ['Biceps curl', 'Hammer curl', 'Triceps pushdown', 'Skull crusher', 'Dips']],
  [/full/, ['Squat', 'Bench press', 'Deadlift', 'Overhead press', 'Barbell row', 'Pull-up']],
  [/core|abs/, ['Hanging leg raise', 'Cable crunch', 'Ab wheel']]
];
const POPULAR = ['Squat', 'Bench press', 'Deadlift', 'Overhead press', 'Barbell row', 'Pull-up', 'Biceps curl', 'Triceps pushdown'];
const POPULAR_ALL = [...new Set(EX_IDEAS.flatMap(x => x[1]))];
function exIdeas(day) {
  const n = keyOf(day.name);
  let list = [];
  for (const [re, l] of EX_IDEAS) if (re.test(n)) list.push(...l);
  if (!list.length) list = POPULAR;
  const have = new Set(day.exercises.map(e => keyOf(e.name)));
  return [...new Set(list)].filter(x => !have.has(keyOf(x))).slice(0, 8);
}
function addExToDay(day, name) {
  name = name.trim();
  if (!name || day.exercises.some(e => keyOf(e.name) === keyOf(name))) return false;
  const e = { id: uid(), name };
  if (isBW(name)) e.bw = true;
  day.exercises.push(e);
  return true;
}

/* ---------- Theme ---------- */
const mq = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const t = S.theme === 'auto' ? (mq.matches ? 'dark' : 'light') : S.theme;
  document.documentElement.dataset.theme = t;
  $('meta[name=theme-color]').setAttribute('content', t === 'dark' ? '#0b0d12' : '#f6f7fb');
}
if (mq.addEventListener) mq.addEventListener('change', () => { applyTheme(); if (view === 'progress') drawChart(); });

/* ---------- Views ---------- */
function needsBackup() {
  const now = Date.now();
  return S.logs.length >= 3 && S.backupSnooze < now && now - (S.lastBackup || 0) > 14 * DAY;
}

function greeting() {
  const h = new Date().getHours();
  return h < 5 ? 'Late night session?' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
}

function heroCard() {
  const ws = weekStart(), lws = ws - 7 * DAY, todayIdx = (new Date().getDay() + 6) % 7;
  let n = 0, sets = 0, vol = 0, ln = 0;
  const trained = new Set();
  for (const l of S.logs) {
    if (l.date >= ws) { n++; sets += logSets(l); vol += logVolume(l); trained.add(dayStart(l.date)); }
    else if (l.date >= lws) ln++;
  }
  const letters = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  let dots = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(ws); d.setDate(d.getDate() + i);
    const on = trained.has(d.getTime());
    dots += `<div><span>${letters[i]}</span><div class="wdot${on ? ' on' : ''}${i === todayIdx ? ' today' : ''}">${on ? ICON.checkSm : ''}</div></div>`;
  }
  const big = n ? `${n} workout${n === 1 ? '' : 's'} this week` : (ln ? 'Time to beat last week' : 'Let\'s get moving');
  return `<div class="hero"><div class="hi">${greeting()} · ${dateStr(Date.now(), { weekday: 'long', day: 'numeric', month: 'long' })}</div>
    <div class="big">${big}</div>
    <div class="week">${dots}</div>
    <div class="mini"><div><b>${sets}</b>sets</div><div><b>${fmtInt(vol)}</b>${S.unit} lifted</div><div><b>${ln}</b>last week</div></div></div>`;
}

function vWorkout() {
  if (S.active) return vActive();
  if (!S.days.length) return `<div class="welcome"><div class="logo">${ICON.dumbbell}</div>
    <h3>Build your own split</h3>
    <p class="muted">Set up the days you train and the exercises you do. Make it exactly how you like it.</p>
    <div class="steps"><div><i>1</i><span>Add your training days, like Push or Monday</span></div>
    <div><i>2</i><span>Add your exercises and how many sets</span></div>
    <div><i>3</i><span>Tap start and log your lifts</span></div></div>
    <button class="btn primary block" data-act="plan">Start building</button>
    <p class="small muted mt">Have a backup file? <button class="tag" data-act="import">Restore it</button></p></div>`;
  let h = '';
  if (needsBackup()) h += `<div class="card banner"><b>Back up your workouts</b>
    <p class="small">Your data is only saved on this phone. If you clear your browser or lose your phone, it is gone. Save a backup file and keep it somewhere safe.</p>
    <div class="row mt"><button class="btn sm primary" data-act="export">Save backup</button><button class="btn sm" data-act="snooze">Later</button></div></div>`;
  h += heroCard();
  // "Up next" is the day after the one you did most recently.
  let nextId = null, latest = null;
  for (const l of S.logs) if (dayById(l.dayId) && (!latest || l.date > latest.date)) latest = l;
  if (latest && S.days.length > 1) { const i = S.days.findIndex(d => d.id === latest.dayId); nextId = S.days[(i + 1) % S.days.length].id; }
  h += `<h2>Your split</h2>`;
  for (const d of S.days) {
    const last = S.logs.filter(l => l.dayId === d.id).reduce((m, l) => Math.max(m, l.date), 0);
    const ex = d.exercises.map(e => e.name.trim()).filter(Boolean);
    h += `<div class="card day" style="--c:${esc(d.color)}"><div class="badge">${esc(initial(d.name))}</div><div class="grow">
      <div class="dayname">${esc(d.name || 'Untitled day')} ${d.id === nextId ? '<span class="tag">Up next</span>' : ''}</div>
      <div class="small muted">${ex.length ? ex.length + ' exercise' + (ex.length === 1 ? '' : 's') + ' · ' + esc(ex.slice(0, 3).join(', ')) + (ex.length > 3 ? '…' : '') : 'No exercises yet'}</div>
      <div class="small muted">${last ? 'Last done ' + ago(last) : 'Not done yet'}</div></div>
      <button class="go" data-act="start" data-id="${d.id}" aria-label="Start ${esc(d.name)}">${ICON.play}</button></div>`;
  }
  return h + `<button class="btn block" data-act="plan">Edit split</button>`;
}

function vActive() {
  const a = S.active;
  const total = a.items.reduce((n, it) => n + it.sets.length, 0);
  const done = a.items.reduce((n, it) => n + it.sets.filter(s => s.done).length, 0);
  let h = `<div style="--c:${esc(a.color || COLORS[0])}"><div class="card livecard"><div class="row between"><div class="grow">
    <div class="small" style="opacity:.85">Started at ${new Date(a.started).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</div>
    <div class="dayname">${esc(a.dayName || 'Workout')}</div></div>
    <div class="elapsed" id="elapsed">${clock(Date.now() - a.started)}</div></div>
    <div class="prog"><div style="width:${total ? Math.round(100 * done / total) : 0}%"></div></div>
    <div class="small" style="margin-top:8px;opacity:.9">${done} of ${total} sets done${total && done === total ? '. Great work! 🎉' : ''}</div></div>
    <p class="small muted" style="margin:0 4px 12px">Tap ✓ when you finish a set. Empty boxes use last time's numbers.</p>`;
  a.items.forEach((it, i) => { h += itemCard(it, i); });

  h += `<button class="btn block" data-act="addEx">+ Add exercise</button>

    <div class="stack mt"><button class="btn primary block" data-act="finish">Finish workout</button>
    <button class="btn danger block" data-act="cancelW">Cancel workout</button></div></div>`;

function itemCard(it, i) {
  const last = lastFor(it.name), bw = !!it.bw, doneN = it.sets.filter(s => s.done).length, all = doneN === it.sets.length && doneN > 0;
  let h = `<div class="card"><div class="row"><div class="num${all ? ' ok' : ''}">${all ? ICON.checkSm : i + 1}</div><div class="grow">

      <button class="check${s.done ? ' on' : ''}${popKey === i + '-' + j ? ' pop' : ''}" data-act="done" data-i="${i}" data-s="${j}" aria-label="Set ${j + 1} done" aria-pressed="${!!s.done}">${ICON.check}</button>`;
  });

    <span class="grow"></span><span class="small muted">${doneN} of ${it.sets.length} done</span></div></div>`;

function vHistory() {
  if (!S.logs.length) return `<div class="empty"><div class="logo">${ICON.dumbbell}</div><p><b>No workouts yet</b></p><p class="muted">When you finish a workout, it shows up here.</p></div>`;
  const logs = [...S.logs].sort((a, b) => b.date - a.date);
  let h = `<p class="small muted">${logs.length} workout${logs.length === 1 ? '' : 's'} in total. Tap one to see the details.</p>`, month = '';
  for (const l of logs) {

    if (m !== month) { month = m; h += `<h2>${m}</h2>`; }
    const isOpen = openLogs.has(l.id), vol = logVolume(l);

function progressNames() {
  const m = new Map();
  for (const l of [...S.logs].sort((a, b) => b.date - a.date))
    for (const e of l.entries) if (e.name.trim() && e.sets.length && !m.has(keyOf(e.name))) m.set(keyOf(e.name), e.name.trim());
  return [...m.values()];
}

const METRICS = {
  heavy: { label: 'Heaviest set', bwLabel: 'Most extra weight', unit: () => S.unit },
  orm: { label: 'Est. 1RM', unit: () => S.unit },
  vol: { label: 'Volume', unit: () => S.unit },
  maxr: { label: 'Most reps', unit: () => 'reps' },
  reps: { label: 'Total reps', unit: () => 'reps' }
};

function vProgress() {
  chartPts = [];
  const names = progressNames();
  if (!names.length) return `<div class="empty"><div class="logo"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M5 15l4-5 4 3 6-7"/></svg></div><p><b>Nothing to show yet</b></p><p class="muted">Finish a workout and your progress charts appear here.</p></div>`;
  if (!names.some(n => keyOf(n) === keyOf(prog.name))) prog.name = names[0];
  const data = entriesFor(prog.name);
  const bw = data.length && data[data.length - 1].bw;
  const keys = bw ? ['maxr', 'reps', 'heavy'] : ['heavy', 'orm', 'vol'];
  if (!keys.includes(prog.metric)) prog.metric = keys[0];
  const u = METRICS[prog.metric].unit();
  chartPts = data.map(d => ({ t: d.date, v: stats(d.sets)[prog.metric] }));
  const vals = chartPts.map(p => p.v), best = Math.max(...vals), last = vals[vals.length - 1], change = last - vals[0];
  const show = v => (prog.metric === 'vol' ? fmtInt(v) : fmt(v));
  let h = `<select id="progEx" data-set="progEx" aria-label="Exercise" style="font-weight:700">${names.map(n => `<option value="${esc(n)}"${keyOf(n) === keyOf(prog.name) ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select>
    <div class="seg mt">${keys.map(k => `<button class="${k === prog.metric ? 'on' : ''}" data-act="metric" data-m="${k}">${esc(bw && METRICS[k].bwLabel ? METRICS[k].bwLabel : METRICS[k].label)}</button>`).join('')}</div>
    ${prog.metric === 'orm' ? '<p class="small muted">Est. 1RM is a guess of the most you could lift for 1 rep, worked out from your sets.</p>' : ''}
    ${prog.metric === 'vol' ? '<p class="small muted">Volume is weight × reps, added up for all sets that day.</p>' : ''}
    <div class="card mt"><canvas id="chart" aria-label="Progress chart"></canvas>
    ${chartPts.length < 2 ? '<p class="small muted center">Do this exercise a few more times to see a line.</p>' : ''}</div>
    <div class="stats"><div class="stat"><b>${show(best)}</b><span>best (${u})</span></div>
    <div class="stat"><b>${show(last)}</b><span>last time</span></div>
    <div class="stat"><b style="color:${change > 0 ? 'var(--good)' : 'inherit'}">${change > 0 ? '+' : ''}${show(change)}</b><span>since first</span></div></div>
    <h2>Recent sessions</h2><div class="card">`;
  for (const d of data.slice(-8).reverse())
    h += `<div class="list-row"><span class="muted">${dateStr(d.date)}</span><span>${esc(d.sets.map(s => fmtSet(s, d.bw)).join(', '))}</span></div>`;
  return h + `</div><p class="small muted center">${data.length} session${data.length === 1 ? '' : 's'} logged</p>`;
}

function drawChart() {
  const cv = $('#chart');
  if (!cv || !chartPts.length) return;
  const pts = chartPts, dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 320, H = 220;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(document.documentElement), col = n => cs.getPropertyValue(n).trim();
  const vals = pts.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo) { const pad = Math.max(1, hi * 0.1); lo -= pad; hi += pad; }
  // Round the axis to nice steps (1, 2, 2.5 or 5 times a power of 10).
  const raw = (hi - lo) / 3, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(x => x >= raw);
  lo = Math.max(0, Math.floor(lo / step) * step); hi = Math.ceil(hi / step) * step;
  const ticks = Math.round((hi - lo) / step);
  const L = 42, R = 12, T = 12, B = 26, pw = W - L - R, ph = H - T - B;
  const X = i => pts.length === 1 ? L + pw / 2 : L + pw * i / (pts.length - 1);
  const Y = v => T + ph * (1 - (v - lo) / (hi - lo));
  const short = v => v >= 10000 ? Math.round(v / 1000) + 'k' : v >= 1000 ? (Math.round(v / 100) / 10) + 'k' : String(Math.round(v * 10) / 10);
  c.font = '11px system-ui,sans-serif'; c.fillStyle = col('--muted'); c.strokeStyle = col('--line'); c.lineWidth = 1;
  c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let k = 0; k <= ticks; k++) { const v = lo + step * k, y = Y(v); c.beginPath(); c.moveTo(L, y); c.lineTo(W - R, y); c.stroke(); c.fillText(short(v), L - 6, y); }
  c.textBaseline = 'top'; c.textAlign = 'left';
  c.fillText(dateStr(pts[0].t, { day: 'numeric', month: 'short' }), L, H - B + 8);
  if (pts.length > 1) { c.textAlign = 'right'; c.fillText(dateStr(pts[pts.length - 1].t, { day: 'numeric', month: 'short' }), W - R, H - B + 8); }
  const a1 = col('--accent'), a2 = col('--accent2');
  if (pts.length > 1) {
    const fill = c.createLinearGradient(0, T, 0, T + ph);
    fill.addColorStop(0, a1 + '40'); fill.addColorStop(1, a1 + '00');
    c.beginPath(); c.moveTo(X(0), T + ph);
    pts.forEach((p, i) => c.lineTo(X(i), Y(p.v)));
    c.lineTo(X(pts.length - 1), T + ph); c.closePath(); c.fillStyle = fill; c.fill();
  }
  const stroke = c.createLinearGradient(L, 0, W - R, 0);
  stroke.addColorStop(0, a1); stroke.addColorStop(1, a2);
  c.strokeStyle = stroke; c.lineWidth = 3; c.lineJoin = 'round'; c.lineCap = 'round'; c.beginPath();
  pts.forEach((p, i) => i ? c.lineTo(X(i), Y(p.v)) : c.moveTo(X(i), Y(p.v)));
  c.stroke();
  if (pts.length <= 40) pts.forEach((p, i) => {
    c.beginPath(); c.arc(X(i), Y(p.v), i === pts.length - 1 ? 6 : 4, 0, Math.PI * 2);
    c.fillStyle = col('--card'); c.fill(); c.lineWidth = 2.5; c.stroke();
  });
}

const TITLES = { workout: 'LiftLog', history: 'History', progress: 'Progress', settings: 'Settings', plan: 'Your split' };
function render() {
  const fns = { workout: vWorkout, history: vHistory, progress: vProgress, settings: vSettings, plan: vPlan };
  $('#view').innerHTML = (fns[view] || vWorkout)();
  $('#title').textContent = view === 'workout' && S.active ? 'Workout' : TITLES[view];
  const tab = view === 'plan' ? 'workout' : view;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#liveDot').classList.toggle('hidden', !S.active);
  if (view === 'progress') drawChart();
}
let enterT = 0;
function go(v) {
  view = v; render(); window.scrollTo(0, 0);
  const el = $('#view');
  el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter');
  clearTimeout(enterT); enterT = setTimeout(() => el.classList.remove('enter'), 700);
}

/* ---------- Modal, toast, confetti ---------- */
let modalOk = null;
function openModal(html) { $('#sheet').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); $('#sheet').innerHTML = ''; modalOk = null; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function confirmBox(title, text, okLabel, fn, danger) {
  openModal(`<h3>${esc(title)}</h3>${text ? `<p class="muted">${esc(text)}</p>` : ''}
    <div class="row mt"><button class="btn grow" data-act="close">Go back</button>
    <button class="btn grow ${danger ? 'dangerfill' : 'primary'}" data-act="ok">${esc(okLabel)}</button></div>`);
  modalOk = fn;
}
let toastTimer = 0;
function hideToast() { $('#toast').classList.add('hidden'); }
function toast(msg, fn, label, ms) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${fn ? `<button id="toastBtn">${esc(label || 'Undo')}</button>` : ''}`;
  t.classList.remove('hidden');
  if (fn) $('#toastBtn').onclick = () => { hideToast(); fn(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, ms || (fn ? 7000 : 2500));
}
// Takes a snapshot now. Calling the returned function puts everything back.
function undoSnap() {
  const snap = JSON.stringify(S);
  return () => { S = normalize(JSON.parse(snap)); save(); applyTheme(); render(); toast('Undone'); };
}
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.createElement('canvas');
  cv.className = 'confetti'; document.body.appendChild(cv);
  const W = cv.width = innerWidth, H = cv.height = innerHeight, c = cv.getContext('2d');
  const ps = Array.from({ length: 150 }, () => ({
    x: W / 2 + (Math.random() - .5) * 80, y: H * .45, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 5,
    s: Math.random() * 6 + 5, r: Math.random() * 6, vr: (Math.random() - .5) * .3, col: COLORS[Math.floor(Math.random() * COLORS.length)]
  }));
  const t0 = performance.now();
  (function frame(t) {
    const k = t - t0;
    c.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.globalAlpha = Math.max(0, 1 - k / 2400);
      c.fillStyle = p.col; c.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); c.restore();
    }
    if (k < 2400) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

/* ---------- Workout ---------- */
function makeItem(name, bw, target) {
  const last = lastFor(name), prev = last ? last.sets : [], n = target || prev.length || 3, sets = [];
  for (let i = 0; i < n; i++) {
    const p = prev[i] || prev[prev.length - 1];
    sets.push({ w: '', r: '', pw: p ? p.w : '', pr: p ? p.r : '', done: false });
  }
  const it = { id: uid(), name: name.trim(), sets };
  if (bw) it.bw = true;
  return it;
}
function startDay(id) {
  const d = dayById(id);
  if (!d) return;
  S.active = { dayId: d.id, dayName: d.name, color: d.color, started: Date.now(), note: '',
    items: d.exercises.filter(e => e.name.trim()).map(e => makeItem(e.name, e.bw, e.sets)) };
  save(); go('workout');
}
function toggleDone(i, j) {
  unlockAudio();
  const it = S.active && S.active.items[i], s = it && it.sets[j];
  if (!s) return;
  if (s.done) { s.done = false; save(); render(); return; }
  if (blank(s.w) && !blank(s.pw)) s.w = String(s.pw);
  if (blank(s.r) && !blank(s.pr)) s.r = String(s.pr);
  if (!(num(s.r) > 0)) {
    toast('Type your reps first.');
    const el = document.querySelector(`input[data-i="${i}"][data-s="${j}"][data-f="r"]`);
    if (el) el.focus();
    return;
  }
  s.done = true; popKey = i + '-' + j; save(); render(); startRest();
}
function collectEntries() {
  const entries = [];
  for (const it of S.active.items) {
    const sets = it.sets.filter(s => num(s.r) > 0).map(s => ({ w: num(s.w), r: num(s.r) }));
    if (sets.length && it.name.trim()) { const e = { name: it.name.trim(), sets }; if (it.bw) e.bw = true; entries.push(e); }
  }
  return entries;
}
function confirmFinish() {
  if (!collectEntries().length) {
    confirmBox('Nothing to save yet', 'No sets have reps typed in. Do you want to throw this workout away?', 'Throw away', cancelWorkout, true);
    return;
  }
  const open = S.active.items.reduce((n, it) => n + it.sets.filter(s => !s.done && num(s.r) > 0).length, 0);
  confirmBox('Finish workout?', 'Sets with reps typed in will be saved. Empty sets are skipped.' + (open ? ` ${open} set${open === 1 ? ' is' : 's are'} not ticked yet, but will still be saved.` : ''), 'Finish', doFinish);
}
function findRecords(entries) {
  const out = [];
  for (const e of entries) {
    const prev = entriesFor(e.name);
    if (!prev.length) continue;
    const pb = { heavy: 0, orm: 0, maxr: 0, vol: 0 };
    for (const p of prev) { const st = stats(p.sets); for (const k in pb) pb[k] = Math.max(pb[k], st[k]); }
    const st = stats(e.sets);
    if (e.bw && st.heavy === 0) { if (st.maxr > pb.maxr) out.push(`${e.name}: most reps in a set, ${st.maxr}`); continue; }
    if (st.heavy > pb.heavy) out.push(`${e.name}: heaviest set, ${fmt(st.heavy)} ${S.unit}`);
    else if (st.orm > pb.orm) out.push(`${e.name}: best estimated 1RM, ${fmt(st.orm)} ${S.unit}`);
    else if (st.vol > pb.vol) out.push(`${e.name}: most volume, ${fmtInt(st.vol)} ${S.unit}`);
    else if (st.maxr > pb.maxr) out.push(`${e.name}: most reps in a set, ${st.maxr}`);
  }
  return out;
}
function doFinish() {
  const a = S.active, entries = collectEntries();
  const records = findRecords(entries);
  const log = { id: uid(), date: Date.now(), started: a.started, dayId: a.dayId, dayName: a.dayName, color: a.color, entries };
  if (a.note && a.note.trim()) log.note = a.note.trim();
  S.logs.push(log); S.active = null; stopRest(); save(); go('workout');
  const vol = logVolume(log);
  openModal(`<div class="center"><div style="font-size:44px">${records.length ? '🏆' : '💪'}</div><h3>${records.length ? 'New records!' : 'Workout saved'}</h3></div>
    <div class="stats mt"><div class="stat"><b>${Math.max(0, Math.round((log.date - log.started) / 60000))}</b><span>minutes</span></div>
    <div class="stat"><b>${logSets(log)}</b><span>sets</span></div><div class="stat"><b>${fmtInt(vol)}</b><span>${S.unit} lifted</span></div></div>
    ${records.length ? `<ul class="mt">${records.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : '<p class="muted mt center">No new records this time. Showing up is what counts.</p>'}
    <button class="btn primary block mt" data-act="close">Done</button>`);
  if (records.length) confetti();
}
function cancelWorkout() {
  const u = undoSnap();
  S.active = null; stopRest(); save(); go('workout');
  toast('Workout thrown away', u);
}
function addExerciseModal() {
  openModal(`<h3>Add exercise</h3>
    <input id="newEx" placeholder="Exercise name" list="names2" autocomplete="off" aria-label="Exercise name">
    <datalist id="names2">${knownNames().map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <div class="setting mt"><span>Bodyweight exercise (like pull-ups)</span><button class="tgl" id="newBw" data-act="tglSelf" aria-label="Bodyweight"></button></div>
    <div class="row mt"><button class="btn grow" data-act="close">Cancel</button><button class="btn primary grow" data-act="addExOk">Add</button></div>`);
  setTimeout(() => { const el = $('#newEx'); if (el) el.focus(); }, 50);

/* ---------- Plate calculator ---------- */
function plates(target, bar, unit) {
  const list = unit === 'lb' ? [45, 35, 25, 10, 5, 2.5] : [25, 20, 15, 10, 5, 2.5, 1.25];
  let side = (target - bar) / 2;
  if (side < 0) return null;
  const out = [];
  for (const p of list) while (side >= p - 1e-9) { out.push(p); side -= p; }
  return { out, left: Math.round(side * 2 * 100) / 100 };
}
function plateModal(i) {
  const it = S.active.items[i];
  if (!it) return;
  let w = '';
  for (const s of it.sets) if (!blank(s.w)) w = s.w;
  if (blank(w) && it.sets[0] && !blank(it.sets[0].pw)) w = it.sets[0].pw;
  openModal(`<h3>Plate calculator</h3><p class="small muted">${esc(it.name)}</p>
    <div class="row" style="align-items:flex-end"><label class="grow"><span class="small muted">Total weight (${S.unit})</span>
    <input id="plateTarget" data-f="plateTarget" inputmode="decimal" value="${esc(w)}"></label>
    <label style="width:110px"><span class="small muted">Bar (${S.unit})</span><input data-f="bar" inputmode="decimal" value="${fmt(S.bar)}"></label></div>
    <div id="plateOut" class="mt"></div><button class="btn block mt" data-act="close">Close</button>`);
  updatePlates();
}
function updatePlates() {
  const out = $('#plateOut'), inp = $('#plateTarget');
  if (!out || !inp) return;
  const t = num(inp.value);
  if (!t) { out.innerHTML = '<p class="small muted">Type the total weight you want on the bar.</p>'; return; }
  const r = plates(t, S.bar, S.unit);
  if (!r) { out.innerHTML = `<p class="small">That is less than the bar itself (${fmt(S.bar)} ${S.unit}).</p>`; return; }
  if (!r.out.length) { out.innerHTML = `<p>Just the empty bar.</p>`; return; }
  const max = S.unit === 'lb' ? 45 : 25, counts = {};
  for (const p of r.out) counts[p] = (counts[p] || 0) + 1;
  out.innerHTML = `<p class="small muted">Put this on <b>each side</b>:</p>
    <div class="plates"><span class="barend"></span>${r.out.map(p => `<span class="plate" style="height:${Math.round(35 + 65 * p / max)}%">${fmt(p)}</span>`).join('')}</div>
    <p><b>${Object.keys(counts).map(Number).sort((a, b) => b - a).map(p => `${counts[p]} × ${fmt(p)} ${S.unit}`).join(', ')}</b></p>
    ${r.left > 0 ? `<p class="small" style="color:var(--bad)">You can't make this exactly with normal plates. This is ${fmt(r.left)} ${S.unit} short.</p>` : ''}`;
}

/* ---------- Rest timer ---------- */
let restEnd = 0, restTotal = 0, restDoneAt = 0, actx = null;
function unlockAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { }
}
function beep() {
  if (!actx) return;
  const t = actx.currentTime;
  [0, 0.3].forEach(o => {
    const g = actx.createGain(), os = actx.createOscillator();
    os.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t + o);
    g.gain.exponentialRampToValueAtTime(0.4, t + o + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o + 0.22);
    os.connect(g); g.connect(actx.destination);
    os.start(t + o); os.stop(t + o + 0.25);
  });
}
function startRest() { if (!S.rest) return; restTotal = S.rest * 1000; restEnd = Date.now() + restTotal; restDoneAt = 0; tick(); }
function stopRest() { restEnd = 0; restDoneAt = 0; tick(); }
function restOver() {
  if (S.alert) { try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) { } beep(); }
}
function tick() {
  const el = $('#elapsed');
  if (el && S.active) el.textContent = clock(Date.now() - S.active.started);
  const bar = $('#restBar'), now = Date.now();
  if (restEnd) {
    const left = restEnd - now;
    if (left > 0) {
      bar.classList.remove('hidden', 'over'); document.body.classList.add('resting');
      $('#restLabel').textContent = 'Rest';
      $('#restTime').textContent = clock(left + 999);
      $('#restFill').style.width = Math.min(100, 100 * (1 - left / restTotal)) + '%';
      return;
    }
    restEnd = 0; restDoneAt = now; restOver();
  }
  if (restDoneAt && now - restDoneAt < 5000) {
    bar.classList.remove('hidden'); bar.classList.add('over'); document.body.classList.add('resting');
    $('#restLabel').textContent = 'Rest is over';
    $('#restTime').textContent = 'Next set';
    $('#restFill').style.width = '100%';
    return;
  }
  restDoneAt = 0; bar.classList.add('hidden'); document.body.classList.remove('resting');
}
setInterval(tick, 250);

/* ---------- Backup ---------- */
function markBackup() { S.lastBackup = Date.now(); S.backupSnooze = 0; save(); render(); toast('Backup saved'); }
async function exportBackup() {
  const d = new Date(), p = v => String(v).padStart(2, '0');
  const name = `liftlog-backup-${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}.json`;
  const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
      await navigator.share({ files: [file], title: 'LiftLog backup' });
      markBackup(); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  markBackup();
}
function importFile(input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    let obj;
    try { obj = JSON.parse(reader.result); } catch (e) { obj = null; }
    if (!obj || !Array.isArray(obj.days) || !Array.isArray(obj.logs)) { toast('This does not look like a LiftLog backup file.'); return; }
    confirmBox('Restore this backup?', `It has ${obj.logs.length} workout${obj.logs.length === 1 ? '' : 's'} and ${obj.days.length} day${obj.days.length === 1 ? '' : 's'}. It will replace what is on this phone now.`, 'Restore', () => {
      const u = undoSnap();
      S = normalize(obj); save(); applyTheme(); go('workout');
      toast('Backup restored', u);
    });
  };
  reader.readAsText(f);
}

/* ---------- Events ---------- */
function moveIn(arr, idx, by) { const j = idx + by; if (j < 0 || j >= arr.length) return; [arr[idx], arr[j]] = [arr[j], arr[idx]]; }
function focusSoon(sel) { const el = document.querySelector(sel); if (el) el.focus({ preventScroll: true }); }
function addDayNamed(name) {
  name = name.trim();
  if (!name) { toast('Type a day name first.'); return; }
  const used = new Set(S.days.map(d => d.color));
  const color = COLORS.find(c => !used.has(c)) || COLORS[S.days.length % COLORS.length];
  const d = { id: uid(), name, color, exercises: [] };
  S.days.push(d); save(); render();
  focusSoon(`[data-new="${d.id}"]`);
}
const A = {
  tab: d => go(d.tab),
  start: d => startDay(d.id),
  plan: () => { openEx = null; go('plan'); },
  planDone: () => { save(); openEx = null; go('workout'); },
  export: () => exportBackup(),
  import: () => $('#importFile').click(),
  snooze: () => { S.backupSnooze = Date.now() + 3 * DAY; save(); render(); },
  done: d => toggleDone(+d.i, +d.s),
  addSet: d => {
    const it = S.active.items[+d.i]; if (!it) return;
    const p = it.sets[it.sets.length - 1];
    it.sets.push({ w: '', r: '', pw: p ? (blank(p.w) ? p.pw : p.w) : '', pr: p ? (blank(p.r) ? p.pr : p.r) : '', done: false });
    save(); render();
  },
  rmSet: d => { const it = S.active.items[+d.i]; if (it && it.sets.length > 1) { it.sets.pop(); save(); render(); } },
  rmItem: d => {
    const it = S.active.items[+d.i]; if (!it) return;
    const u = undoSnap(); S.active.items.splice(+d.i, 1); save(); render();
    toast(`Removed ${it.name}`, u);
  },
  addEx: () => addExerciseModal(),
  tglSelf: (d, b) => b.classList.toggle('on'),
  addExOk: () => {
    const name = ($('#newEx').value || '').trim();
    if (!name) { toast('Type a name first.'); return; }
    S.active.items.push(makeItem(name, $('#newBw').classList.contains('on'))); save(); closeModal(); render();
    const cards = document.querySelectorAll('#view .card'); const lastCard = cards[cards.length - 1];
    if (lastCard) lastCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
  },
  plates: d => plateModal(+d.i),
  finish: () => confirmFinish(),
  cancelW: () => confirmBox('Cancel workout?', 'Nothing from this workout will be saved.', 'Throw away', cancelWorkout, true),
  restAdj: d => {
    if (!restEnd) return;
    const by = +d.v * 1000;
    restEnd += by; restTotal = Math.max(1000, restTotal + by);
    if (restEnd <= Date.now()) stopRest(); else tick();
  },
  restSkip: () => stopRest(),
  close: () => closeModal(),
  ok: () => { const f = modalOk; closeModal(); if (f) f(); },
  toggleLog: d => { openLogs.has(d.id) ? openLogs.delete(d.id) : openLogs.add(d.id); render(); },
  delLog: d => confirmBox('Delete this workout?', 'It will be removed from your history and charts.', 'Delete', () => {
    const u = undoSnap(); S.logs = S.logs.filter(l => l.id !== d.id); save(); render(); toast('Workout deleted', u);
  }, true),
  metric: d => { prog.metric = d.m; render(); },
  set: d => {
    if (d.k === 'unit' && S.unit !== d.v) {
      if (d.v === 'lb' && S.bar === 20) S.bar = 45;
      if (d.v === 'kg' && S.bar === 45) S.bar = 20;
      S.unit = d.v;
    }
    if (d.k === 'theme') { S.theme = d.v; applyTheme(); }
    save(); render();
  },
  toggleAlert: () => { S.alert = !S.alert; save(); render(); if (S.alert) { unlockAudio(); beep(); } },
  // Split editor
  addDay: () => { const el = $('#newDay'); addDayNamed(el ? el.value : ''); },
  dayIdea: d => addDayNamed(d.n),
  delDay: d => {
    const day = dayById(d.id); if (!day) return;
    const u = undoSnap(); S.days = S.days.filter(x => x.id !== d.id); save(); render();
    toast(`Deleted ${day.name || 'day'}`, u);
  },
  moveDay: d => { moveIn(S.days, S.days.findIndex(x => x.id === d.id), +d.v); save(); render(); },
  color: d => {
    const day = dayById(d.id); if (!day) return;
    day.color = COLORS[(COLORS.indexOf(day.color) + 1) % COLORS.length]; save(); render();
  },
  addPlanEx: d => {
    const day = dayById(d.id), el = document.querySelector(`[data-new="${d.id}"]`);
    if (!day || !el) return;
    if (!el.value.trim()) { toast('Type an exercise name first.'); el.focus(); return; }
    if (!addExToDay(day, el.value)) { toast('That exercise is already on this day.'); return; }
    save(); render(); focusSoon(`[data-new="${d.id}"]`);
  },
  exIdea: d => { const day = dayById(d.id); if (day && addExToDay(day, d.n)) { save(); render(); } },
  exOpts: d => { openEx = openEx === d.e ? null : d.e; render(); },
  exSets: d => {
    const day = dayById(d.id), e = day && day.exercises.find(x => x.id === d.e); if (!e) return;
    e.sets = Math.min(10, Math.max(1, (e.sets || 3) + +d.v)); save(); render();
  },
  delEx: d => {
    const day = dayById(d.id); if (!day) return;
    const e = day.exercises.find(x => x.id === d.e); if (!e) return;
    const u = undoSnap(); day.exercises = day.exercises.filter(x => x.id !== d.e); openEx = null; save(); render();
    if (e.name.trim()) toast(`Removed ${e.name}`, u);
  },
  moveEx: d => { const day = dayById(d.id); if (!day) return; moveIn(day.exercises, day.exercises.findIndex(x => x.id === d.e), +d.v); save(); render(); },
  bwEx: d => {
    const day = dayById(d.id), e = day && day.exercises.find(x => x.id === d.e); if (!e) return;
    if (e.bw) delete e.bw; else e.bw = true;
    save(); render();
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = A[b.dataset.act];
  if (fn) fn(b.dataset, b);
});

document.addEventListener('input', e => {
  const t = e.target, f = t.dataset.f;
  if (t.id === 'newEx') { const n = t.value.trim(), bw = $('#newBw'); if (n && knownNames().some(k => keyOf(k) === keyOf(n))) bw.classList.toggle('on', isBW(n)); return; }
  if (!f) return;
  if (f === 'note' && S.active) { S.active.note = t.value; saveSoon(); }
  else if ((f === 'w' || f === 'r') && S.active) {
    const it = S.active.items[+t.dataset.i], s = it && it.sets[+t.dataset.s];
    if (s) { s[f] = t.value; saveSoon(); }
  }
  else if (f === 'dayName') { const d = dayById(t.dataset.d); if (d) { d.name = t.value; saveSoon(); } }
  else if (f === 'exName') { const d = dayById(t.dataset.d), x = d && d.exercises.find(x => x.id === t.dataset.e); if (x) { x.name = t.value; saveSoon(); } }
  else if (f === 'bar') { S.bar = Math.max(0, num(t.value)); saveSoon(); updatePlates(); }
  else if (f === 'plateTarget') updatePlates();
});

document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.set;
  if (t.id === 'importFile') return importFile(t);
  if (k === 'rest') { S.rest = +t.value; save(); }
  else if (k === 'progEx') { prog.name = t.value; prog.metric = ''; render(); }
  else if (t.dataset.f === 'bar' && view === 'settings') render();
  else if (t.dataset.f === 'dayName' && view === 'plan') { save(); render(); }
});

// Enter key shortcuts.
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const t = e.target, ds = t.dataset || {};
  if (ds.f === 'w') {
    const r = document.querySelector(`input[data-f="r"][data-i="${ds.i}"][data-s="${ds.s}"]`);
    if (r) { e.preventDefault(); r.focus(); }
  } else if (ds.f === 'r' || ds.f === 'exName' || ds.f === 'dayName') { e.preventDefault(); t.blur(); }
  else if (ds.new) { e.preventDefault(); A.addPlanEx({ id: ds.new }); }
  else if (t.id === 'newDay') { e.preventDefault(); A.addDay(); }
  else if (t.id === 'newEx') { e.preventDefault(); A.addExOk(); }
});

let resizeT = 0;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (view === 'progress') drawChart(); }, 150); });

/* ---------- Start ---------- */
applyTheme();
go('workout');

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (nw) nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller)
            toast('A new version of LiftLog is ready.', () => { save(); location.reload(); }, 'Reload', 20000);
        });
      });
    }).catch(() => { });
  });
}
</script>
</body>
