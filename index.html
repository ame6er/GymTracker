<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LiftLog</title>
<meta name="description" content="A free, simple gym workout tracker.">
<meta name="theme-color" content="#f6f7fb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LiftLog">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{--accent:#4f46e5;--accent2:#9333ea;--bg:#f6f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e8eaf1;--input:#f2f4f8;--good:#16a34a;--good-soft:#dcfce7;--bad:#dc2626;--warn-soft:#fff6db;--cardline:transparent;--shadow:0 1px 2px rgba(15,23,42,.05);--accent-soft:color-mix(in srgb,var(--accent) 13%,var(--card));--accent-text:color-mix(in srgb,var(--accent) 75%,var(--text));color-scheme:light}
:root[data-theme=dark]{--bg:#0b0d12;--card:#151821;--text:#f1f5f9;--muted:#94a3b8;--line:#262a36;--input:#0f1219;--good:#22c55e;--good-soft:#11301e;--bad:#f87171;--warn-soft:#332a10;--cardline:#1f2330;--shadow:none;--accent-soft:color-mix(in srgb,var(--accent) 22%,var(--card));--accent-text:color-mix(in srgb,var(--accent) 45%,var(--text));color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.resting{padding-bottom:calc(174px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:calc(12px + env(safe-area-inset-top)) 16px 8px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:608px;margin:0 auto;min-height:40px}
.top h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0}
.finish{background:var(--good);color:#fff;min-height:38px;padding:0 18px;border-radius:12px;font-weight:700}
main{max-width:640px;margin:0 auto;padding:6px 16px 24px}
h2{font-size:14px;font-weight:650;margin:30px 2px 12px;color:var(--muted)}
h3{font-size:20px;margin:0 0 8px;letter-spacing:-.01em}
p{margin:6px 0}
.card{background:var(--card);border:1px solid var(--cardline);border-radius:18px;padding:18px;margin:0 0 16px;box-shadow:var(--shadow)}
.banner{background:var(--warn-soft);box-shadow:none}
.muted{color:var(--muted)}
.small{font-size:14px}
.center{text-align:center}
.mt{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:8px}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.3;cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:12px;background:var(--input);font-weight:600;font-size:15px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff}
.btn.soft{background:var(--accent-soft);color:var(--accent-text)}
.btn.danger{color:var(--bad)}
.btn.dangerfill{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.link{font-size:15px;font-weight:600;color:var(--accent-text);padding:10px 2px;min-height:40px}
.link.muted{color:var(--muted)}
.link.danger{color:var(--bad)}
.pic{width:44px;height:44px;border-radius:12px;background:var(--input);color:var(--text);display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.pic svg{width:82%;height:82%;opacity:.85}
.pic.sm{width:34px;height:34px;border-radius:10px}
.pic.ok::after{content:"";position:absolute;right:-4px;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--good);border:2px solid var(--card)}
.icon-btn{width:36px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--input);border:1px solid transparent;border-radius:12px;padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{min-height:80px;resize:vertical}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);font-weight:700;vertical-align:middle;letter-spacing:.01em}
.tag.lg{font-size:13px;padding:5px 12px}

/* Home */
.hero{background:var(--card);border:1px solid var(--cardline);border-radius:18px;padding:20px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.hero .hi{font-size:13px;color:var(--muted)}
.hero .big{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-top:2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:16px;text-align:center}
.week span{font-size:11px;color:var(--muted);font-weight:600}
.wdot{width:28px;height:28px;margin:6px auto 0;border-radius:50%;background:var(--input);display:flex;align-items:center;justify-content:center;color:#fff}
.wdot.on{background:var(--accent)}
.wdot.today{outline:1.5px solid var(--accent);outline-offset:2px}
.mini{display:flex;gap:24px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.mini b{display:block;font-size:17px;color:var(--text);font-variant-numeric:tabular-nums}
.badge{width:46px;height:46px;border-radius:15px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.badge.sm{width:34px;height:34px;border-radius:11px;font-size:15px}
.dayname{font-weight:750;font-size:17px;letter-spacing:-.01em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.tpl{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;margin:0;padding:16px;min-height:140px;transition:transform .15s}
.tpl:active{transform:scale(.97)}
.tpl .exl{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.tpl .foot{margin-top:auto;font-size:12px;color:var(--muted);font-weight:600}
.welcome{text-align:center;padding:24px 8px}
.logo{width:72px;height:72px;border-radius:22px;margin:10px auto 18px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff}
.welcome h3{font-size:26px;font-weight:800}
.steps{text-align:left;margin:22px 0}
.steps div{display:flex;gap:12px;align-items:center;padding:10px 0}
.steps i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}

/* Workout */
.livecard{}
.livecard .dayname{font-size:22px}
.livecard .icon-btn{width:30px;height:30px}
.elapsed{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.prog{height:4px;border-radius:2px;background:var(--input);overflow:hidden;margin-top:16px}
.prog div{height:100%;background:var(--c);border-radius:2px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.num{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;transition:background .3s}
.num.ok{background:var(--good);color:#fff}
.exname{font-weight:650;font-size:16px;color:var(--text)}
.hint{background:color-mix(in srgb,var(--good) 12%,transparent);color:var(--good);border-radius:12px;padding:8px 10px;font-size:13px;margin-top:10px;font-weight:600}
.sets{display:grid;grid-template-columns:22px 64px 1fr 1fr 40px;gap:8px;align-items:center}
.sets .hd{font-size:12px;color:var(--muted);text-align:center;font-weight:600;display:flex;justify-content:center}
.sets input{text-align:center;padding:8px 2px;font-variant-numeric:tabular-nums;font-weight:600;transition:background .3s}
.sets input.done{background:var(--good-soft)}
.setno{text-align:center;color:var(--muted);font-weight:700}
.prev{font-size:13px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.check{width:40px;height:38px;border-radius:10px;background:var(--input);display:flex;align-items:center;justify-content:center;color:var(--muted);opacity:.8;transition:background .2s}
.check.on{background:var(--good);color:#fff;opacity:1}
.check.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.rline{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--accent-text);margin:-2px 0}
.rline::before,.rline::after{content:"";flex:1;height:2px;border-radius:1px;background:color-mix(in srgb,var(--accent) 22%,transparent)}
.rline span{font-variant-numeric:tabular-nums;padding:1px 8px;border-radius:999px}
.rline.live span{background:var(--accent);color:#fff}
.rline.live::before,.rline.live::after{background:var(--accent)}

/* Menus and exercise list */
.mrow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 2px;border-top:1px solid var(--line);text-align:left;font-weight:600}
.mrow.danger{color:var(--bad)}
.sheet.tall{height:90vh;display:flex;flex-direction:column}
#libList{flex:1;overflow:auto;margin:8px -6px 0;padding:0 6px}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px}
.hscroll::-webkit-scrollbar{display:none}
.fchip{padding:7px 13px;border-radius:999px;background:var(--input);font-size:13px;font-weight:650;color:var(--muted);white-space:nowrap;flex:none}
.fchip.on{background:var(--accent);color:#fff}
.lhd{font-size:12px;font-weight:800;color:var(--muted);padding:12px 4px 4px}
.lrow{display:flex;align-items:center;gap:12px;padding:8px 6px;width:100%;text-align:left;border-radius:14px;transition:background .15s}
.lrow.sel{background:var(--accent-soft)}
.lrow:disabled{opacity:.45}
.lic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none;font-size:15px}
.lrow b{display:block;font-weight:650}
.lsel{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.lrow.sel .lsel{background:var(--accent);border-color:var(--accent)}
.libfoot{padding-top:12px;border-top:1px solid var(--line);margin-top:4px}

/* Supersets */
.card.ss{border-left:3px solid var(--accent)}
.sslabel{display:inline-block;font-size:11px;font-weight:700;color:var(--accent-text);background:var(--accent-soft);border-radius:999px;padding:2px 8px;vertical-align:middle;letter-spacing:.02em}
.pex.ss{box-shadow:inset 4px 0 0 var(--accent);padding-left:10px;border-radius:4px}

/* Profile */
.avatar{width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stats2 .stat{text-align:left;padding:14px}
.stats2 .stat b{font-size:24px}
.streak{display:flex;align-items:center;gap:14px}
.streak .fire{font-size:42px;line-height:1}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:12px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--muted);min-width:0}
.bars i{display:block;width:100%;border-radius:6px;background:var(--accent);min-height:4px;transition:height .5s}
.bars i.zero{background:var(--line)}
.bars b{color:var(--text);font-size:12px}
.bars span{white-space:nowrap;font-size:10px}
.pb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.pb:first-child{border-top:0}

/* Plan editor */
.cdot{width:30px;height:30px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.dname{font-weight:750;font-size:18px;background:transparent;padding:8px 6px}
.pex{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.pex:first-of-type{margin-top:8px}
.pex input{background:transparent;padding:9px 6px;font-weight:600}
.pill{font-size:12px;font-weight:700;color:var(--muted);background:var(--input);border-radius:999px;padding:7px 11px;white-space:nowrap;flex:none}
.pill.on{background:var(--accent-soft);color:var(--accent-text)}
.opts{background:var(--input);border-radius:14px;padding:12px;margin:2px 0 10px}
.opts .btn,.opts input{background:var(--card)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:38px;height:38px;border-radius:12px;background:var(--input);font-size:20px;font-weight:700}
.opts .stepper button{background:var(--card)}
.stepper b{min-width:48px;text-align:center;font-size:16px;font-variant-numeric:tabular-nums}
.tgl{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tgl.on{background:var(--good)}
.tgl.on::after{transform:translateX(20px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px dashed var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--muted);transition:transform .12s}
.chip:active{transform:scale(.95)}
.chip::before{content:"+ ";color:var(--accent)}

/* Shared bits */
.seg{display:flex;background:var(--input);border-radius:14px;padding:4px;gap:2px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-weight:650;color:var(--muted);font-size:14px;padding:0 4px;transition:background .2s,color .2s}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.accents{display:flex;gap:12px;flex-wrap:wrap}
.acc{width:42px;height:42px;border-radius:50%;transition:transform .15s}
.acc.on{outline:3px solid var(--text);outline-offset:3px}
.acc:active{transform:scale(.9)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--cardline);box-shadow:var(--shadow);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.sheet .stat{background:var(--input);box-shadow:none}
.loghead{display:flex;width:100%;text-align:left;align-items:center;gap:12px}
.chev{color:var(--muted);transition:transform .2s;display:flex}
.chev.up{transform:rotate(180deg)}
.logex{padding:10px 0;border-top:1px solid var(--line)}
.logbody{margin-top:12px}
.note{white-space:pre-wrap;background:var(--input);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px}
.note1{margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-style:italic}
.empty{text-align:center;padding:48px 16px}
.empty .logo{width:72px;height:72px;border-radius:24px}
canvas#chart{display:block;width:100%;height:220px}
.list-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.list-row:first-child{border-top:0}
.plates{display:flex;align-items:center;gap:4px;height:100px;margin:8px 0}
.plates .barend{width:24px;height:12px;background:var(--muted);border-radius:3px}
.plate{width:28px;border-radius:6px;background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}

/* Nav, rest bar, modal, toast */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs>div{display:flex;max-width:640px;margin:0 auto}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.tabs .ic{display:flex;padding:4px 14px;border-radius:999px;transition:background .25s}
.tabs button.on{color:var(--accent-text)}
.tabs button.on .ic{background:var(--accent-soft)}
.tabs svg{width:22px;height:22px}
.live{position:absolute;top:6px;left:calc(50% + 14px);width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px var(--card);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.4}}
.rest{position:fixed;left:10px;right:10px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:9;background:#111827;color:#fff;border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:6px;max-width:620px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.3)}
:root[data-theme=dark] .rest{background:#252a38}
.rest.over{background:var(--good)}
.rest .time{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.rest .track{height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin-top:6px;overflow:hidden}
.rest .track div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .25s linear}
.rest button{background:rgba(255,255,255,.12);border-radius:12px;min-height:40px;padding:0 10px;font-size:14px;font-weight:650}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:24px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:slideUp .28s cubic-bezier(.2,.8,.2,1)}
.sheet ul{padding-left:20px;margin:6px 0}
.sheet li{margin:4px 0}
.toast{position:fixed;left:16px;right:16px;top:calc(64px + env(safe-area-inset-top));z-index:30;background:#111827;color:#fff;border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:608px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:drop .25s ease}
.toast button{color:#c4b5fd;font-weight:700;min-height:36px;padding:0 4px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
@keyframes fade{from{opacity:0}}
@keyframes slideUp{from{transform:translateY(40px);opacity:.5}}
@keyframes drop{from{transform:translateY(-10px);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
.enter>*{animation:fadeUp .4s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.04s}
.enter>*:nth-child(3){animation-delay:.08s}
.enter>*:nth-child(4){animation-delay:.12s}
.enter>*:nth-child(5){animation-delay:.16s}
.enter>*:nth-child(n+6){animation-delay:.2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="toprow"><h1 id="title">LiftLog</h1><button id="topFinish" class="finish hidden" data-act="finish">Finish</button></div></header>
<main id="view"></main>

<div id="restBar" class="rest hidden" role="timer" aria-live="polite">
  <div class="grow">
    <div id="restLabel" class="small">Rest</div>
    <div id="restTime" class="time">0:00</div>
    <div class="track"><div id="restFill"></div></div>
  </div>
  <button data-act="restAdj" data-v="-15">-15s</button>
  <button data-act="restAdj" data-v="15">+15s</button>
  <button data-act="restSkip">Skip</button>
</div>

<nav class="tabs"><div>

function defaults() {

// Cleans the optional exercise settings. In the split, "sets" is a number (how many sets to start with).
// In a running workout, "sets" is the list of sets, so it must be left alone (isPlan = false).
function cleanTarget(x, isPlan) {
  if (isPlan && x.sets != null) { const n = Math.round(num(x.sets)); if (n >= 1 && n <= 20) x.sets = n; else delete x.sets; }
  if (x.reps != null) { const r = String(x.reps).trim().slice(0, 12); if (r) x.reps = r; else delete x.reps; }
  if (x.rest != null) { const r = Math.round(num(x.rest)); if (r >= 0 && r <= 900) x.rest = r; else delete x.rest; }
  if (x.ss != null) { const g = String(x.ss).slice(0, 24); if (g) x.ss = g; else delete x.ss; }

}

// Cleans up saved data so old or partial data always works.

function normalize(raw) {
  const s = Object.assign(defaults(), raw && typeof raw === 'object' ? raw : {});

  }));

    id: l.id || uid(), date: num(l.date) || num(l.started) || Date.now(), started: num(l.started) || num(l.date),
    entries: l.entries.filter(e => e && typeof e === 'object').map(e => Object.assign({}, e, {
      name: String(e.name == null ? '' : e.name),
      sets: (Array.isArray(e.sets) ? e.sets : []).filter(x => x && typeof x === 'object').map(x => ({ w: num(x.w), r: num(x.r) }))

  }));

    a.items = a.items.filter(it => it && typeof it === 'object').map(it => cleanTarget(Object.assign({}, it, {

function load() {
  let raw = null;

  try { return normalize(JSON.parse(raw)); }
  catch (e) {
    // Never throw away data we cannot read: keep a copy under another key.
    try { localStorage.setItem(KEY + '-unreadable-' + Date.now(), raw); } catch (_) { }
    return defaults();
  }
}

  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;

}

function weekStart() { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); }

const itemRest = it => it.rest != null ? it.rest : S.rest;
const ICON_USER = '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>';
const accentHex = () => ACCENTS[S.accent][1];
// Supersets: exercises that share the same "ss" group id are done back to back.
function cleanGroups(list) {
  const c = {};
  for (const x of list) if (x.ss) c[x.ss] = (c[x.ss] || 0) + 1;
  for (const x of list) if (x.ss && c[x.ss] < 2) delete x.ss;
}
function groupInList(list, ids) {
  const chosen = list.filter(x => ids.has(x.id));
  if (chosen.length < 2) return list;
  const g = 'g' + uid(), first = list.findIndex(x => ids.has(x.id));
  const others = list.filter(x => !ids.has(x.id));
  const before = list.slice(0, first).filter(x => !ids.has(x.id)).length;
  chosen.forEach(x => { x.ss = g; });
  others.splice(before, 0, ...chosen);
  cleanGroups(others);
  return others;
}
function nextInGroup(list, i) {
  const g = list[i] && list[i].ss;
  if (!g) return null;
  for (let k = i + 1; k < list.length; k++) if (list[k].ss === g) return k;
  return null;
}
function groupLetters(list) {
  const m = {}; let n = 0;
  for (const x of list) if (x.ss && !m[x.ss]) m[x.ss] = String.fromCharCode(65 + n++ % 26);
  return m;
}
function weekStartOf(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); }
function addWeeks(t, n) { const d = new Date(t); d.setDate(d.getDate() + 7 * n); return d.getTime(); }
function workoutName() {
  const h = new Date().getHours();
  return h < 12 ? 'Morning workout' : h < 17 ? 'Afternoon workout' : 'Evening workout';
}

/* ---------- Ideas for building a split ---------- */
const DAY_IDEAS = ['Push', 'Pull', 'Legs', 'Upper', 'Lower', 'Full body', 'Chest', 'Back', 'Shoulders', 'Arms'];
const EX_IDEAS = [
  [/push/, ['Bench press', 'Overhead press', 'Incline dumbbell press', 'Lateral raise', 'Triceps pushdown', 'Dips']],
  [/pull/, ['Deadlift', 'Pull-up', 'Barbell row', 'Lat pulldown', 'Seated cable row', 'Face pull', 'Biceps curl']],
  [/leg|lower/, ['Squat', 'Romanian deadlift', 'Leg press', 'Leg curl', 'Leg extension', 'Calf raise', 'Lunge']],
  [/upper/, ['Bench press', 'Barbell row', 'Overhead press', 'Pull-up', 'Biceps curl', 'Triceps pushdown']],
  [/chest/, ['Bench press', 'Incline dumbbell press', 'Chest fly', 'Dips', 'Push-up']],
  [/back/, ['Deadlift', 'Pull-up', 'Barbell row', 'Lat pulldown', 'Seated cable row']],
  [/shoulder/, ['Overhead press', 'Lateral raise', 'Rear delt fly', 'Face pull', 'Shrug']],
  [/arm|bicep|tricep/, ['Biceps curl', 'Hammer curl', 'Triceps pushdown', 'Skull crusher', 'Dips']],
  [/full/, ['Squat', 'Bench press', 'Deadlift', 'Overhead press', 'Barbell row', 'Pull-up']],
  [/core|abs/, ['Hanging leg raise', 'Cable crunch', 'Ab wheel']]
];
const POPULAR = ['Squat', 'Bench press', 'Deadlift', 'Overhead press', 'Barbell row', 'Pull-up', 'Biceps curl', 'Triceps pushdown'];
function exIdeas(day) {
  const n = keyOf(day.name);
  let list = [];
  for (const [re, l] of EX_IDEAS) if (re.test(n)) list.push(...l);
  if (!list.length) list = POPULAR;
  const have = new Set(day.exercises.map(e => keyOf(e.name)));
  return [...new Set(list)].filter(x => !have.has(keyOf(x))).slice(0, 6);
}
function addExToDay(day, name) {
  name = name.trim();
  if (!name || day.exercises.some(e => keyOf(e.name) === keyOf(name))) return false;
  const e = { id: uid(), name };
  if (isBW(name)) e.bw = true;
  day.exercises.push(e);
  return true;
}

function needsBackup() {
  const now = Date.now();
  return S.logs.length >= 3 && S.backupSnooze < now && now - (S.lastBackup || 0) > 14 * DAY;
}
function greeting() {
  const h = new Date().getHours();
  return h < 5 ? 'Late night session?' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
}

function heroCard() {
  const ws = weekStart(), lws = ws - 7 * DAY, todayIdx = (new Date().getDay() + 6) % 7;
  let n = 0, sets = 0, vol = 0, ln = 0;
  const trained = new Set();
  for (const l of S.logs) {
    if (l.date >= ws) { n++; sets += logSets(l); vol += logVolume(l); trained.add(dayStart(l.date)); }
    else if (l.date >= lws) ln++;
  }
  const letters = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  let dots = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(ws); d.setDate(d.getDate() + i);
    const on = trained.has(d.getTime());
    dots += `<div><span>${letters[i]}</span><div class="wdot${on ? ' on' : ''}${i === todayIdx ? ' today' : ''}">${on ? ICON.checkSm : ''}</div></div>`;
  }
  const big = n ? `${n} workout${n === 1 ? '' : 's'} this week` : (ln ? 'Time to beat last week' : 'Let\'s get moving');
  const hi = S.name ? greeting().replace('?', '') + ', ' + esc(S.name) + (greeting().endsWith('?') ? '?' : '') : greeting();
  return `<div class="hero"><div class="hi">${hi} · ${dateStr(Date.now(), { weekday: 'long', day: 'numeric', month: 'long' })}</div>
    <div class="big">${big}</div>
    <div class="week">${dots}</div>
    <div class="mini"><div><b>${sets}</b>sets</div><div><b>${fmtInt(vol)}</b>${S.unit} lifted</div><div><b>${ln}</b>last week</div></div></div>`;
}

  const i = S.days.findIndex(d => d.id === latest.dayId);
  return S.days[(i + 1) % S.days.length].id;
}

const targetTxt = e => (e.reps ? `${e.sets || 3} × ${e.reps}` : `${e.sets || 3} sets`) + (e.bw ? ' · BW' : '');

function progressHint(it, last) {

}

function ssToPlan(names, remove) {
  const d = S.active && dayById(S.active.dayId); if (!d) return;

  if (remove) { for (const e of d.exercises) if (keys.has(keyOf(e.name))) delete e.ss; cleanGroups(d.exercises); return; }
  const ids = new Set(d.exercises.filter(e => keys.has(keyOf(e.name))).map(e => e.id));
  if (ids.size >= 2) { for (const e of d.exercises) if (ids.has(e.id)) delete e.ss; cleanGroups(d.exercises); d.exercises = groupInList(d.exercises, ids); }

function vProfile() {
  const logs = S.logs;
  let ms = 0, vol = 0, sets = 0;
  for (const l of logs) { ms += Math.max(0, l.date - (l.started || l.date)); vol += logVolume(l); sets += logSets(l); }
  const first = logs.reduce((m, l) => Math.min(m, l.date), Infinity);
  // Week streak: weeks in a row with at least one workout (this week counts once you train).
  const weeks = new Set(logs.map(l => weekStartOf(l.date)));
  let cur = 0, w = weekStart();
  if (!weeks.has(w)) w = addWeeks(w, -1);
  while (weeks.has(w)) { cur++; w = addWeeks(w, -1); }
  let best = 0, run = 0, prev = null;
  for (const x of [...weeks].sort((a, b) => a - b)) { run = prev != null && addWeeks(prev, 1) === x ? run + 1 : 1; best = Math.max(best, run); prev = x; }
  const hours = Math.round(ms / 360000) / 10;
  let h = `<div class="card"><div class="row"><div class="avatar">${S.name ? esc(initial(S.name)) : ICON_USER}</div><div class="grow">
    <div class="dayname" style="font-size:22px">${S.name ? esc(S.name) : 'Your profile'}</div>
    <div class="small muted">${logs.length ? 'Training since ' + dateStr(first, { month: 'long', year: 'numeric' }) : 'No workouts yet'}</div></div>
    <button class="icon-btn" data-act="editName" aria-label="Edit name">${ICON.pencil}</button></div>
    ${S.name ? '' : '<button class="tag lg mt" data-act="editName">Add your name</button>'}</div>
    <div class="card streak"><div class="fire">${cur ? '🔥' : '💤'}</div><div class="grow">
    <div class="dayname">${cur} week streak</div>
    <div class="small muted">${cur ? 'You trained every week for ' + cur + ' week' + (cur === 1 ? '' : 's') + '. Keep it going!' : 'Do a workout this week to start a streak.'} Best: ${best} week${best === 1 ? '' : 's'}.</div></div></div>
    <div class="stats2"><div class="stat"><b>${logs.length}</b><span>workouts</span></div><div class="stat"><b>${hours}</b><span>hours trained</span></div>
    <div class="stat"><b>${fmtInt(sets)}</b><span>sets done</span></div><div class="stat"><b>${fmtInt(vol)}</b><span>${S.unit} lifted</span></div></div>`;
  const ws = weekStart(), counts = [];
  for (let k = 7; k >= 0; k--) { const a = addWeeks(ws, -k), b = addWeeks(ws, -k + 1); counts.push({ a, n: logs.filter(l => l.date >= a && l.date < b).length }); }
  const max = Math.max(1, ...counts.map(c => c.n));
  h += `<h2>Workouts per week</h2><div class="card"><div class="bars">${counts.map(c => `<div><b>${c.n || ''}</b><i class="${c.n ? '' : 'zero'}" style="height:${c.n ? Math.round(85 * c.n / max) : 3}%"></i><span>${dateStr(c.a, { day: 'numeric', month: 'short' })}</span></div>`).join('')}</div></div>`;
  const names = progressNames();
  if (names.length) {
    h += `<h2>Your best lifts</h2><div class="card">`;
    for (const n of names.slice(0, 12)) {
      const data = entriesFor(n), bw = data.length && data[data.length - 1].bw;
      let top = null, orm = 0, when = 0;
      for (const d of data) for (const s of d.sets) {
        if (!top || s.w > top.w || (s.w === top.w && s.r > top.r)) { top = s; when = d.date; }
        orm = Math.max(orm, e1rm(s.w, s.r));
      }
      if (!top) continue;
      const main = bw && !top.w ? `${top.r} reps` : `${fmt(top.w)} ${S.unit} × ${top.r}`;
      h += `<button class="pb" data-act="pbOpen" data-n="${esc(n)}">${pic(n, 'sm')}<span class="grow"><b>${esc(n)}</b><span class="small muted" style="display:block">${dateStr(when, { day: 'numeric', month: 'short', year: 'numeric' })}</span></span>
        <span style="text-align:right"><b>${esc(main)}</b>${orm && !(bw && !top.w) ? `<span class="small muted" style="display:block">Est. 1RM ${fmt(Math.round(orm * 10) / 10)}</span>` : ''}</span></button>`;
    }
    h += `</div>`;
  } else h += `<p class="muted center mt">Finish a workout to see your best lifts here.</p>`;
  return h;
}

function progressNames() {

  return h + `</div><p class="small muted center">${data.length} session${data.length === 1 ? '' : 's'} logged</p>`;
}

function drawChart() {
  const cv = $('#chart');
  if (!cv || !chartPts.length) return;
  const pts = chartPts, dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 320, H = 220;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(document.documentElement), col = n => cs.getPropertyValue(n).trim();
  const vals = pts.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo) { const pad = Math.max(1, hi * 0.1); lo -= pad; hi += pad; }
  // Round the axis to nice steps (1, 2, 2.5 or 5 times a power of 10).
  const raw = (hi - lo) / 3, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(x => x >= raw);
  lo = Math.max(0, Math.floor(lo / step) * step); hi = Math.ceil(hi / step) * step;
  const ticks = Math.round((hi - lo) / step);
  const L = 42, R = 12, T = 12, B = 26, pw = W - L - R, ph = H - T - B;
  const X = i => pts.length === 1 ? L + pw / 2 : L + pw * i / (pts.length - 1);
  const Y = v => T + ph * (1 - (v - lo) / (hi - lo));
  const short = v => v >= 10000 ? Math.round(v / 1000) + 'k' : v >= 1000 ? (Math.round(v / 100) / 10) + 'k' : String(Math.round(v * 10) / 10);
  c.font = '11px system-ui,sans-serif'; c.fillStyle = col('--muted'); c.strokeStyle = col('--line'); c.lineWidth = 1;
  c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let k = 0; k <= ticks; k++) { const v = lo + step * k, y = Y(v); c.beginPath(); c.moveTo(L, y); c.lineTo(W - R, y); c.stroke(); c.fillText(short(v), L - 6, y); }
  c.textBaseline = 'top'; c.textAlign = 'left';
  c.fillText(dateStr(pts[0].t, { day: 'numeric', month: 'short' }), L, H - B + 8);
  if (pts.length > 1) { c.textAlign = 'right'; c.fillText(dateStr(pts[pts.length - 1].t, { day: 'numeric', month: 'short' }), W - R, H - B + 8); }
  const a1 = col('--accent'), a2 = col('--accent2');
  if (pts.length > 1) {
    const fill = c.createLinearGradient(0, T, 0, T + ph);
    fill.addColorStop(0, a1); fill.addColorStop(1, 'rgba(0,0,0,0)');
    c.save(); c.globalAlpha = 0.22;
    c.beginPath(); c.moveTo(X(0), T + ph);
    pts.forEach((p, i) => c.lineTo(X(i), Y(p.v)));
    c.lineTo(X(pts.length - 1), T + ph); c.closePath(); c.fillStyle = fill; c.fill(); c.restore();
  }
  const stroke = c.createLinearGradient(L, 0, W - R, 0);
  stroke.addColorStop(0, a1); stroke.addColorStop(1, a2);
  c.strokeStyle = stroke; c.lineWidth = 3; c.lineJoin = 'round'; c.lineCap = 'round'; c.beginPath();
  pts.forEach((p, i) => i ? c.lineTo(X(i), Y(p.v)) : c.moveTo(X(i), Y(p.v)));
  c.stroke();
  if (pts.length <= 40) pts.forEach((p, i) => {
    c.beginPath(); c.arc(X(i), Y(p.v), i === pts.length - 1 ? 6 : 4, 0, Math.PI * 2);
    c.fillStyle = col('--card'); c.fill(); c.lineWidth = 2.5; c.stroke();
  });
}

  renderLib();
}
function libTargetNames() {
  if (!lib) return new Set();
  if (lib.target === 'workout') return new Set((S.active ? S.active.items : []).map(it => keyOf(it.name)));
  const d = dayById(lib.target);
  return new Set(d ? d.exercises.map(e => keyOf(e.name)) : []);
}
function renderLib() {
  if (!lib || !$('#libList')) return;
  const mine = myNames(), have = libTargetNames(), q = keyOf(lib.q);
  $('#libParts').innerHTML = ['All', 'Mine', ...PARTS].map(p => `<button class="fchip${lib.part === p ? ' on' : ''}" data-act="libPart" data-p="${p}">${p === 'Mine' ? 'My exercises' : p}</button>`).join('');
  const all = new Map(LIB.map(x => [keyOf(x.name), x]));
  for (const [k, n] of mine) if (!all.has(k)) all.set(k, { name: n, part: 'Other', equip: '' });
  let items = [...all.values()];
  if (lib.part === 'Mine') items = items.filter(x => mine.has(keyOf(x.name)));
  else if (lib.part !== 'All') items = items.filter(x => x.part === lib.part);
  if (q) items = items.filter(x => keyOf(x.name).includes(q));
  items.sort((a, b) => a.name.localeCompare(b.name));
  let h = '';
  if (q && !all.has(q)) h += `<button class="lrow" data-act="libCreate"><span class="lic" style="background:${accentHex()}">+</span><span class="grow"><b>Create "${esc(lib.q.trim())}"</b><span class="small muted">Add your own exercise</span></span></button>`;
  for (const x of lib.sel) if (!all.has(keyOf(x)) && (!q || keyOf(x).includes(q))) items.unshift({ name: x, part: 'Other', equip: '' });
  let letter = '';
  for (const x of items) {
    const L = (x.name[0] || '').toUpperCase();
    if (L !== letter) { letter = L; h += `<div class="lhd">${esc(L)}</div>`; }
    const sel = lib.sel.some(n => keyOf(n) === keyOf(x.name)), added = have.has(keyOf(x.name));

    let best = '';
    if (last) { const top = last.sets.reduce((m, s) => (s.w > m.w || (s.w === m.w && s.r > m.r)) ? s : m, last.sets[0]); best = fmtSet(top, last.bw) + (last.bw && !top.w ? '' : ' ' + S.unit); }
    const sub = added ? 'Already added' : (x.part === 'Other' ? 'Your exercise' : x.part + (x.equip ? ' · ' + x.equip : ''));
    h += `<button class="lrow${sel ? ' sel' : ''}" data-act="libPick" data-n="${esc(x.name)}"${added ? ' disabled' : ''}>

function libAdd() {
  if (!lib || !lib.sel.length) return;
  const names = lib.sel, target = lib.target;
  if (target === 'workout' && S.active) {
    for (const n of names) S.active.items.push(makeItem(n, isBW(n)));
  } else {
    const d = dayById(target);

    x: W / 2 + (Math.random() - .5) * 80, y: H * .45, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 5,
    s: Math.random() * 6 + 5, r: Math.random() * 6, vr: (Math.random() - .5) * .3, col: COLORS[Math.floor(Math.random() * COLORS.length)]

/* ---------- Workout ---------- */
function makeItem(name, bw, plan) {

  }
  const it = { id: uid(), name: name.trim(), sets };
  if (bw) it.bw = true;

}
function startDay(id) {

function toggleDone(i, j) {

  if (blank(s.w) && !blank(s.pw)) s.w = String(s.pw);
  if (blank(s.r) && !blank(s.pr)) s.r = String(s.pr);
  if (!(num(s.r) > 0)) {
    toast('Type your reps first.');
    const el = document.querySelector(`input[data-i="${i}"][data-s="${j}"][data-f="r"]`);

  }

}
function collectEntries() {
  const entries = [];
  for (const it of S.active.items) {
    const sets = it.sets.filter(s => num(s.r) > 0).map(s => ({ w: num(s.w), r: num(s.r) }));
    if (sets.length && it.name.trim()) { const e = { name: it.name.trim(), sets }; if (it.bw) e.bw = true; entries.push(e); }
  }

}
function confirmFinish() {
  if (!collectEntries().length) {

    return;
  }
  const open = S.active.items.reduce((n, it) => n + it.sets.filter(s => !s.done && num(s.r) > 0).length, 0);
  confirmBox('Finish workout?', 'Sets with reps typed in will be saved. Empty sets are skipped.' + (open ? ` ${open} set${open === 1 ? ' is' : 's are'} not ticked yet, but will still be saved.` : ''), 'Finish and save', doFinish, false, 'Keep going');
}
function findRecords(entries) {
  const out = [];
  for (const e of entries) {
    const prev = entriesFor(e.name);
    if (!prev.length) continue;
    const pb = { heavy: 0, orm: 0, maxr: 0, vol: 0 };
    for (const p of prev) { const st = stats(p.sets); for (const k in pb) pb[k] = Math.max(pb[k], st[k]); }
    const st = stats(e.sets);
    if (e.bw && st.heavy === 0) { if (st.maxr > pb.maxr) out.push(`${e.name}: most reps in a set, ${st.maxr}`); continue; }
    if (st.heavy > pb.heavy) out.push(`${e.name}: heaviest set, ${fmt(st.heavy)} ${S.unit}`);
    else if (st.orm > pb.orm) out.push(`${e.name}: best estimated 1RM, ${fmt(st.orm)} ${S.unit}`);
    else if (st.vol > pb.vol) out.push(`${e.name}: most volume, ${fmtInt(st.vol)} ${S.unit}`);
    else if (st.maxr > pb.maxr) out.push(`${e.name}: most reps in a set, ${st.maxr}`);
  }
  return out;
}
function doFinish() {
  const a = S.active, entries = collectEntries();

  if (a.note && a.note.trim()) log.note = a.note.trim();

  const vol = logVolume(log);

    <div class="stat"><b>${logSets(log)}</b><span>sets</span></div><div class="stat"><b>${fmtInt(vol)}</b><span>${S.unit} lifted</span></div></div>
    ${records.length ? `<ul class="mt">${records.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : '<p class="muted mt center">No new records this time. Showing up is what counts.</p>'}

/* ---------- Plate calculator ---------- */
function plates(target, bar, unit) {
  const list = unit === 'lb' ? [45, 35, 25, 10, 5, 2.5] : [25, 20, 15, 10, 5, 2.5, 1.25];
  let side = (target - bar) / 2;
  if (side < 0) return null;
  const out = [];
  for (const p of list) while (side >= p - 1e-9) { out.push(p); side -= p; }
  return { out, left: Math.round(side * 2 * 100) / 100 };
}
function plateModal(i) {
  const it = S.active.items[i];
  if (!it) return;
  let w = '';
  for (const s of it.sets) if (!blank(s.w)) w = s.w;
  if (blank(w) && it.sets[0] && !blank(it.sets[0].pw)) w = it.sets[0].pw;
  openModal(`<h3>Plate calculator</h3><p class="small muted">${esc(it.name)}</p>
    <div class="row" style="align-items:flex-end"><label class="grow"><span class="small muted">Total weight (${S.unit})</span>
    <input id="plateTarget" data-f="plateTarget" inputmode="decimal" value="${esc(w)}"></label>
    <label style="width:110px"><span class="small muted">Bar (${S.unit})</span><input data-f="bar" inputmode="decimal" value="${fmt(S.bar)}"></label></div>
    <div id="plateOut" class="mt"></div><button class="btn block mt" data-act="close">Close</button>`);
  updatePlates();
}
function updatePlates() {
  const out = $('#plateOut'), inp = $('#plateTarget');
  if (!out || !inp) return;
  const t = num(inp.value);
  if (!t) { out.innerHTML = '<p class="small muted">Type the total weight you want on the bar.</p>'; return; }
  const r = plates(t, S.bar, S.unit);
  if (!r) { out.innerHTML = `<p class="small">That is less than the bar itself (${fmt(S.bar)} ${S.unit}).</p>`; return; }
  if (!r.out.length) { out.innerHTML = `<p>Just the empty bar.</p>`; return; }
  const max = S.unit === 'lb' ? 45 : 25, counts = {};
  for (const p of r.out) counts[p] = (counts[p] || 0) + 1;
  out.innerHTML = `<p class="small muted">Put this on <b>each side</b>:</p>
    <div class="plates"><span class="barend"></span>${r.out.map(p => `<span class="plate" style="height:${Math.round(35 + 65 * p / max)}%">${fmt(p)}</span>`).join('')}</div>
    <p><b>${Object.keys(counts).map(Number).sort((a, b) => b - a).map(p => `${counts[p]} × ${fmt(p)} ${S.unit}`).join(', ')}</b></p>
    ${r.left > 0 ? `<p class="small" style="color:var(--bad)">You can't make this exactly with normal plates. This is ${fmt(r.left)} ${S.unit} short.</p>` : ''}`;
}

/* ---------- Rest timer ---------- */
let restEnd = 0, restTotal = 0, restDoneAt = 0, restKey = '', restLen = 0, actx = null;
function unlockAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { }
}
function beep() {
  if (!actx) return;
  const t = actx.currentTime;
  [0, 0.3].forEach(o => {
    const g = actx.createGain(), os = actx.createOscillator();
    os.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t + o);
    g.gain.exponentialRampToValueAtTime(0.4, t + o + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o + 0.22);
    os.connect(g); g.connect(actx.destination);
    os.start(t + o); os.stop(t + o + 0.25);
  });
}
function startRest(sec, key) {
  if (!sec) { stopRest(); return; }
  restLen = sec; restTotal = sec * 1000; restEnd = Date.now() + restTotal; restDoneAt = 0; restKey = key || '';
}
function stopRest() { restEnd = 0; restDoneAt = 0; tick(); restKey = ''; }
function restOver() {
  if (S.alert) { try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) { } beep(); }
}
function tick() {
  const now = Date.now();
  const el = $('#elapsed');
  if (el && S.active) el.textContent = clock(now - S.active.started);
  if (restEnd && restEnd <= now) { restEnd = 0; restDoneAt = now; restOver(); }
  const rl = $('#restLine');
  if (rl) {
    if (restEnd) rl.firstElementChild.textContent = clock(restEnd - now + 999);
    else { rl.classList.remove('live'); rl.removeAttribute('id'); rl.firstElementChild.textContent = restTxt(restLen); }
  }
  const bar = $('#restBar');
  if (restEnd) {
    const left = restEnd - now;
    bar.classList.remove('hidden', 'over'); document.body.classList.add('resting');
    $('#restLabel').textContent = 'Rest';
    $('#restTime').textContent = clock(left + 999);
    $('#restFill').style.width = Math.min(100, 100 * (1 - left / restTotal)) + '%';
    return;
  }
  if (restDoneAt && now - restDoneAt < 5000) {
    bar.classList.remove('hidden'); bar.classList.add('over'); document.body.classList.add('resting');
    $('#restLabel').textContent = 'Rest is over';
    $('#restTime').textContent = 'Next set';
    $('#restFill').style.width = '100%';
    return;
  }
  restDoneAt = 0; bar.classList.add('hidden'); document.body.classList.remove('resting');
}
setInterval(tick, 250);

    setTimeout(() => { const el = $('#wName'); if (el) { el.focus(); el.select(); } }, 50);
  },
  renameOk: () => { const v = ($('#wName').value || '').trim(); if (v) S.active.dayName = v; save(); closeModal(); render(); },
  plates: d => plateModal(+d.i),
  finish: () => confirmFinish(),
  cancelW: () => confirmBox('Cancel workout?', 'Are you sure? Everything from this workout will be lost.', 'Cancel workout', cancelWorkout, true, 'Resume'),
  restAdj: d => {
    if (!restEnd) return;
    const by = +d.v * 1000;
    restEnd += by; restTotal = Math.max(1000, restTotal + by);
    if (restEnd <= Date.now()) stopRest(); else tick();
  },
  restSkip: () => stopRest(),
  close: () => closeModal(),
  ok: () => { const f = modalOk; closeModal(); if (f) f(); },
  toggleLog: d => { openLogs.has(d.id) ? openLogs.delete(d.id) : openLogs.add(d.id); render(); },
  delLog: d => confirmBox('Delete this workout?', 'It will be removed from your history and charts.', 'Delete', () => {
    const u = undoSnap(); S.logs = S.logs.filter(l => l.id !== d.id); save(); render(); toast('Workout deleted', u);
  }, true),
  metric: d => { prog.metric = d.m; render(); },
  set: d => {
    if (d.k === 'unit' && S.unit !== d.v) {
      if (d.v === 'lb' && S.bar === 20) S.bar = 45;
      if (d.v === 'kg' && S.bar === 45) S.bar = 20;
      S.unit = d.v;
    }
    if (d.k === 'theme') { S.theme = d.v; applyTheme(); }
    save(); render();
  },
  accent: d => { S.accent = d.k; applyTheme(); save(); render(); },
  toggleAlert: () => { S.alert = !S.alert; save(); render(); if (S.alert) { unlockAudio(); beep(); } },
  // Split editor
  addDay: () => { const el = $('#newDay'); addDayNamed(el ? el.value : ''); },
  dayIdea: d => addDayNamed(d.n),
  delDay: d => {
    const day = dayById(d.id); if (!day) return;
    const u = undoSnap(); S.days = S.days.filter(x => x.id !== d.id); save(); render();
    toast(`Deleted ${day.name || 'day'}`, u);
  },
  moveDay: d => { moveIn(S.days, S.days.findIndex(x => x.id === d.id), +d.v); save(); render(); },
  color: d => {
    const day = dayById(d.id); if (!day) return;
    day.color = COLORS[(COLORS.indexOf(day.color) + 1) % COLORS.length]; save(); render();
  },
  exIdea: d => { const day = dayById(d.id); if (day && addExToDay(day, d.n)) { save(); render(); } },
  exOpts: d => { openEx = openEx === d.e ? null : d.e; render(); },
  exSets: d => { const e = planEx(d); if (!e) return; e.sets = clamp((e.sets || 3) + +d.v, 1, 10); save(); render(); },
  exRest: d => { const e = planEx(d); if (!e) return; e.rest = clamp((e.rest != null ? e.rest : S.rest) + +d.v, 0, 900); save(); render(); },
  exRestReset: d => { const e = planEx(d); if (!e) return; delete e.rest; save(); render(); },
  delEx: d => {
    const day = dayById(d.id); if (!day) return;
    const e = day.exercises.find(x => x.id === d.e); if (!e) return;
    const u = undoSnap(); day.exercises = day.exercises.filter(x => x.id !== d.e); cleanGroups(day.exercises); openEx = null; save(); render();
    if (e.name.trim()) toast(`Removed ${e.name}`, u);
  },
  moveEx: d => { const day = dayById(d.id); if (!day) return; moveIn(day.exercises, day.exercises.findIndex(x => x.id === d.e), +d.v); save(); render(); },
  bwEx: d => { const e = planEx(d); if (!e) return; if (e.bw) delete e.bw; else e.bw = true; save(); render(); }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = A[b.dataset.act];
  if (fn) fn(b.dataset, b);
});

document.addEventListener('input', e => {
  const t = e.target, f = t.dataset.f;
  if (t.id === 'libSearch' && lib) { lib.q = t.value; renderLib(); return; }
  if (!f) return;
  if (f === 'note' && S.active) { S.active.note = t.value; saveSoon(); }
  else if ((f === 'w' || f === 'r') && S.active) {
    const it = S.active.items[+t.dataset.i], s = it && it.sets[+t.dataset.s];
    if (s) { s[f] = t.value; saveSoon(); }
  }
  else if (f === 'itReps' && S.active) {
    const it = S.active.items[+t.dataset.i];
    if (it) { const v = t.value.trim().slice(0, 12); if (v) it.reps = v; else delete it.reps; syncToPlan(it); saveSoon(); }
  }
  else if (f === 'dayName') { const d = dayById(t.dataset.d); if (d) { d.name = t.value; saveSoon(); } }
  else if (f === 'exName') { const x = planEx({ id: t.dataset.d, e: t.dataset.e }); if (x) { x.name = t.value; saveSoon(); } }
  else if (f === 'exReps') { const x = planEx({ id: t.dataset.d, e: t.dataset.e }); if (x) { const v = t.value.trim().slice(0, 12); if (v) x.reps = v; else delete x.reps; saveSoon(); } }
  else if (f === 'bar') { S.bar = Math.max(0, num(t.value)); saveSoon(); updatePlates(); }
  else if (f === 'plateTarget') updatePlates();
});

document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.set;
  if (t.id === 'importFile') return importFile(t);
  if (k === 'rest') { S.rest = +t.value; save(); }
  else if (k === 'progEx') { prog.name = t.value; prog.metric = ''; render(); }
  else if (t.dataset.f === 'bar' && view === 'settings') render();
  else if ((t.dataset.f === 'dayName' || t.dataset.f === 'exReps') && view === 'plan') { save(); render(); }
});

// Enter key shortcuts.
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const t = e.target, ds = t.dataset || {};
  if (ds.f === 'w') {
    const r = document.querySelector(`input[data-f="r"][data-i="${ds.i}"][data-s="${ds.s}"]`);
    if (r) { e.preventDefault(); r.focus(); }
  } else if (['r', 'exName', 'dayName', 'exReps', 'itReps'].includes(ds.f)) { e.preventDefault(); t.blur(); }
  else if (t.id === 'newDay') { e.preventDefault(); A.addDay(); }
  else if (t.id === 'wName') { e.preventDefault(); A.renameOk(); }
  else if (t.id === 'pName') { e.preventDefault(); A.nameOk(); }
  else if (t.id === 'libSearch') { e.preventDefault(); if (lib && lib.q.trim() && document.querySelector('[data-act=libCreate]')) A.libCreate(); else t.blur(); }
});

let resizeT = 0;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (view === 'progress') drawChart(); }, 150); });

/* ---------- Start ---------- */
applyTheme();
go('workout');

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  // When a new version takes over, load it. During a workout, ask first so nothing feels jumpy.
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    if (S.active) { toast('LiftLog was updated.', () => { save(); location.reload(); }, 'Reload', 20000); return; }
    reloading = true; save(); location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      // Check for a new version each time the app comes back to the screen.
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => { }); });
    }).catch(() => { });
  });
}
</script>
</body>
</html>
